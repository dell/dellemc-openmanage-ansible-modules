---
- name: Ansible Module for Firmware Update with Job Tracking
  hosts: redfish_hosts
  gather_facts: false
  connection: local
  vars:
    retries_count: 100
    polling_interval: 5
    reboot_uri: "/redfish/v1/Systems/System.Embedded.1/Actions/ComputerSystem.Reset"

  tasks:
    - name: Update the firmware from a file
      dellemc.openmanage.redfish_firmware:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        image_uri: "{{ firmware_image_uri }}"
      register: firmware_result

    - name: Poll job status until completion or pending
      ansible.builtin.uri:
        url: "https://{{ baseuri }}{{ firmware_result.task.uri }}"
        user: "{{ username }}"
        password: "{{ password }}"
        method: GET
        use_proxy: true
        status_code: [200, 202]
        return_content: true
        validate_certs: "{{ validate_certs | default(false) }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
      register: job_result
      until: job_result.json.TaskState == 'Completed' or job_result.json.TaskState == 'Pending'
      retries: "{{ retries_count }}"
      delay: "{{ polling_interval }}"

    - name: Reboot if job is scheduled
      ansible.builtin.uri:
        url: "https://{{ baseuri }}{{ reboot_uri }}"
        user: "{{ username }}"
        password: "{{ password }}"
        method: POST
        body_format: raw
        body: '{"ResetType": "ForceRestart"}'
        use_proxy: true
        status_code: 204
        return_content: false
        validate_certs: "{{ validate_certs | default(false) }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
      register: reboot_result
      changed_when: reboot_result.status == 204
      when:
        - job_result.json.TaskState == 'Pending'
        - job_result.json.Messages[0].Message == 'Task successfully scheduled.'

    - name: Wait for firmware update to complete after reboot
      ansible.builtin.wait_for:
        timeout: 240
      when:
        - job_result.json.TaskState == 'Pending'
        - job_result.json.Messages[0].Message == 'Task successfully scheduled.'

    - name: Poll final job status until completed
      ansible.builtin.uri:
        url: "https://{{ baseuri }}{{ firmware_result.task.uri }}"
        user: "{{ username }}"
        password: "{{ password }}"
        method: GET
        use_proxy: true
        status_code: [200, 202]
        return_content: true
        validate_certs: "{{ validate_certs | default(false) }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
      register: final_result
      until: final_result.json.TaskState == 'Completed'
      retries: "{{ retries_count }}"
      delay: "{{ polling_interval }}"

    - name: Set firmware update result fact
      ansible.builtin.set_fact:
        job_details: "{{ final_result.json }}"
      failed_when: final_result.json.TaskState == 'Completed' and final_result.json.TaskStatus != 'OK'
      changed_when: final_result.json.TaskState == 'Completed' and final_result.json.TaskStatus == 'OK'
