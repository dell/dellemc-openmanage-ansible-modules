---
- name: Redfish Storage Volume Management
  hosts: redfish_hosts
  gather_facts: false
  connection: local
  vars:
    retries_count: 15
    polling_interval: 5

  tasks:
    - name: Create a volume with supported options
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        volume_type: Mirrored
        name: VD0
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        drives:
          - Disk.Bay.5:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.6:Enclosure.Internal.0-1:RAID.Slot.1-1
        block_size_bytes: 512
        capacity_bytes: 299439751168
        optimum_io_size_bytes: 65536
        encryption_types: NativeDriveEncryption
        encrypted: true
      register: volume_result
      tags:
        - create_volume1

    - name: Create a volume with minimum options
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        volume_type: NonRedundant
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
      register: volume_result
      tags:
        - create_volume2

    - name: Create a RAID6 volume
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        raid_type: RAID6
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.3:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.4:Enclosure.Internal.0-1:RAID.Slot.1-1
      register: volume_result
      tags:
        - create_raid6

    - name: Create a RAID60 volume
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        raid_type: RAID60
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.3:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.4:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.5:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.6:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.7:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.8:Enclosure.Internal.0-1:RAID.Slot.1-1
      register: volume_result
      tags:
        - create_raid60

    - name: Create a RAID0 on PERC controller on reset
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        raid_type: RAID0
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1
        apply_time: OnReset
      register: volume_result
      tags:
        - create_raid0_with_onreset

    - name: Create a RAID0 on BOSS controller with restart
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        raid_type: RAID0
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1
        apply_time: OnReset
        reboot_server: true
      register: volume_result
      tags:
        - create_raid0_boss_with_onreset

    - name: Create a RAID0 on BOSS controller with force restart
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        controller_id: "{{ controller_id | default('RAID.Slot.1-1') }}"
        raid_type: RAID0
        drives:
          - Disk.Bay.1:Enclosure.Internal.0-1:RAID.Slot.1-1
          - Disk.Bay.2:Enclosure.Internal.0-1:RAID.Slot.1-1
        reboot_server: true
        force_reboot: true
      register: volume_result
      tags:
        - create_raid0_boss_with_onreset_force

    - name: Modify a volumes encryption type settings
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: present
        volume_id: "{{ volume_id | default('Disk.Virtual.5:RAID.Slot.1-1') }}"
        encryption_types: ControllerAssisted
        encrypted: true
      register: volume_result
      tags:
        - modify_volume

    - name: Initialize an existing volume
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        command: initialize
        volume_id: "{{ volume_id | default('Disk.Virtual.5:RAID.Slot.1-1') }}"
        initialize_type: Slow
      register: volume_result
      tags:
        - initialize_volume

    - name: Delete an existing volume
      dellemc.openmanage.redfish_storage_volume:
        baseuri: "{{ baseuri }}"
        username: "{{ username }}"
        password: "{{ password }}"
        ca_path: "{{ ca_path | default(omit) }}"
        state: absent
        volume_id: "{{ volume_id | default('Disk.Virtual.5:RAID.Slot.1-1') }}"
      register: volume_result
      tags:
        - delete_volume
