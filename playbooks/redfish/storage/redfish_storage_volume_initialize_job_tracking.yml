---
- name: Redfish Storage Volume Initialize with Job Tracking
  hosts: redfish_hosts
  gather_facts: false
  connection: local
  vars:
    volume_command: initialize
    volume_id: "{{ volume_id | default('Disk.Virtual.1:RAID.Slot.1-1') }}"
    initialize_type: "{{ initialize_type | default('Slow') }}"

  tasks:
    - name: Include storage volume job tracking
      ansible.builtin.include_tasks: redfish_storage_volume_jobtracking.yml
