---
- name: Redfish Storage Volume Modify with Job Tracking
  hosts: redfish_hosts
  gather_facts: false
  connection: local
  vars:
    volume_state: present
    volume_id: "{{ volume_id | default('Disk.Virtual.1:RAID.Slot.1-1') }}"
    encryption_types: "{{ encryption_types | default('ControllerAssisted') }}"
    encrypted: "{{ encrypted | default(true) }}"

  tasks:
    - name: Include storage volume job tracking
      ansible.builtin.include_tasks: redfish_storage_volume_jobtracking.yml
