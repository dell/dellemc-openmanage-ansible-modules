# Example playbook: idrac_network_attribute_registry
# Queries and validates iDRAC network attribute registry for a specific NIC.

- name: iDRAC Network Attribute Registry Operations
  hosts: idrac
  gather_facts: false
  vars:
    idrac_ip: "{{ lookup('env', 'IDRAC_IP') | default('192.168.0.1', true) }}"
    idrac_user: "{{ lookup('env', 'IDRAC_USER') | default('admin', true) }}"
    idrac_password: "{{ lookup('env', 'IDRAC_PASSWORD') }}"
    validate_certs: false
    network_device_function_id: "{{ lookup('env', 'NIC_ID') | default('NIC.Integrated.1-1-1', true) }}"

  tasks:
    # --- AC1: Query all network attributes for a specific NIC ---
    - name: Query all network attributes for a NIC
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
      register: all_attributes
      tags: [query_all]

    - name: Display all attributes summary
      ansible.builtin.debug:
        msg:
          - "NIC: {{ all_attributes.network_device_function_id }}"
          - "Total attributes: {{ all_attributes.attribute_count }}"
          - "Firmware: {{ all_attributes.firmware_version }}"
          - "Model: {{ all_attributes.idrac_model }}"
      tags: [query_all]

    # --- AC1 (Redfish scope): Query Redfish-only attributes ---
    - name: Query Redfish-only network attributes
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "redfish"
      register: redfish_attributes
      tags: [query_redfish]

    - name: Display Redfish attributes
      ansible.builtin.debug:
        msg: "Redfish attributes: {{ redfish_attributes.attribute_count }}"
      tags: [query_redfish]

    # --- AC2: Query Dell OEM attributes ---
    - name: Query Dell OEM network attributes
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "oem"
      register: oem_attributes
      tags: [query_oem]

    - name: Display OEM attributes
      ansible.builtin.debug:
        msg: "OEM attributes: {{ oem_attributes.attribute_count }}"
      tags: [query_oem]

    # --- AC3: Validate attributes ---
    - name: Validate valid attribute values
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "validate"
        validate_attributes:
          VLanMode: "Enabled"
      register: valid_result
      tags: [validate_valid]

    - name: Display valid attribute result
      ansible.builtin.debug:
        var: valid_result.validation_results
      tags: [validate_valid]

    - name: Validate with intentionally misspelled name
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "validate"
        validate_attributes:
          VLanMod: "Enabled"
      register: invalid_name_result
      tags: [validate_invalid_name]

    - name: Display invalid name result (with suggestions)
      ansible.builtin.debug:
        var: invalid_name_result.validation_results
      tags: [validate_invalid_name]

    - name: Validate with invalid value
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "validate"
        validate_attributes:
          VLanMode: "InvalidValue"
      register: invalid_value_result
      tags: [validate_invalid_value]

    - name: Display invalid value result (with valid values)
      ansible.builtin.debug:
        var: invalid_value_result.validation_results
      tags: [validate_invalid_value]

    # --- AC4: Wildcard pattern filtering ---
    - name: Filter VLAN-related attributes using wildcard
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        attribute_pattern: "VLan*"
      register: vlan_attributes
      tags: [query_filter]

    - name: Display filtered VLAN attributes
      ansible.builtin.debug:
        msg: "VLAN attributes found: {{ vlan_attributes.attribute_count }}"
      tags: [query_filter]

    # --- AC5: Multi-generation query ---
    - name: Query attributes (generation-specific, dynamic discovery)
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
      register: gen_result
      tags: [multi_gen]

    - name: Display generation info
      ansible.builtin.debug:
        msg:
          - "Model: {{ gen_result.idrac_model }}"
          - "Firmware: {{ gen_result.firmware_version }}"
          - "Attributes: {{ gen_result.attribute_count }}"
      tags: [multi_gen]

    # --- Output format examples ---
    - name: Query with YAML output format
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        output_format: "yaml"
      register: yaml_result
      tags: [output_yaml]

    - name: Display YAML output
      ansible.builtin.debug:
        msg: "{{ yaml_result.formatted_output }}"
      tags: [output_yaml]

    - name: Query with table output format
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        output_format: "table"
      register: table_result
      tags: [output_table]

    - name: Display table output
      ansible.builtin.debug:
        msg: "{{ table_result.formatted_output }}"
      tags: [output_table]

    # --- Session token example ---
    # Note: x_auth_token is mutually exclusive with idrac_user/idrac_password.
    # The module uses env_fallback for IDRAC_USERNAME/IDRAC_PASSWORD env vars.
    # When using x_auth_token, ensure those env vars are NOT set, or pass
    # the token via the IDRAC_X_AUTH_TOKEN env var instead (without credentials).
    - name: Query using X-Auth token (pre-established)
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        x_auth_token: "{{ auth_token }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
        validate_certs: "{{ validate_certs }}"
      register: token_result
      when: auth_token is defined
      tags: [token_auth]

    # --- AC6: Session establishment and reuse ---
    - name: Establish iDRAC session for token reuse
      dellemc.openmanage.idrac_session:
        hostname: "{{ idrac_ip }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        state: "present"
      register: session_result
      tags: [auth_session]

    - name: Display session token
      ansible.builtin.debug:
        msg: "Session established: {{ session_result.session_data.Id }}"
      when: session_result is defined and session_result.session_data is defined
      tags: [auth_session]

    # Token-based query is demonstrated in the second play below to avoid
    # conflict with IDRAC_PASSWORD/IDRAC_USERNAME env var fallback.
    - name: Save session token for next play
      ansible.builtin.set_fact:
        saved_x_auth_token: "{{ session_result.x_auth_token }}"
        saved_session_id: "{{ session_result.session_data.Id }}"
      when: session_result is defined and session_result.session_data is defined
      tags: [auth_session]

    # --- AC6: Within-playbook caching demonstration ---
    - name: First query (populates cache)
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
      register: first_query
      tags: [cache_demo]

    - name: Second query (returns cached data, faster)
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
      register: second_query
      tags: [cache_demo]

    - name: Display caching results
      ansible.builtin.debug:
        msg:
          - "First query attributes: {{ first_query.attribute_count }}"
          - "Second query attributes: {{ second_query.attribute_count }}"
          - "Both queries return same data (cached)"
      tags: [cache_demo]

    - name: Force refresh to bypass cache
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        force_refresh: true
      register: refresh_result
      tags: [cache_demo]

    - name: Display force refresh result
      ansible.builtin.debug:
        msg: "Force refresh attributes: {{ refresh_result.attribute_count }}"
      tags: [cache_demo]

    # --- AC6: Multi-target query using loop ---
    - name: Query multiple iDRAC targets
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ item }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
      loop: "{{ idrac_targets | default([idrac_ip]) }}"
      register: multi_target_results
      ignore_errors: true
      tags: [multi_target]

    - name: Aggregate multi-target results
      ansible.builtin.set_fact:
        successful_targets: "{{ multi_target_results.results | selectattr('failed', 'equalto', false) | list }}"
        failed_targets: "{{ multi_target_results.results | selectattr('failed', 'equalto', true) | list }}"
      when: multi_target_results is defined
      tags: [multi_target]

    - name: Display multi-target summary
      ansible.builtin.debug:
        msg:
          - "Total targets: {{ multi_target_results.results | length }}"
          - "Successful: {{ successful_targets | length }}"
          - "Failed: {{ failed_targets | length }}"
      when: multi_target_results is defined
      tags: [multi_target]

    # --- Error handling example ---
    - name: Query with error handling (continues on failure)
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ item }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs }}"
        network_device_function_id: "{{ network_device_function_id }}"
      loop: "{{ idrac_targets | default([idrac_ip]) }}"
      register: error_handling_results
      ignore_errors: true
      tags: [error_handling]

    - name: Report per-target status
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'SUCCESS' if not item.failed else 'FAILED - ' + item.msg }}"
      loop: "{{ error_handling_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: error_handling_results is defined
      tags: [error_handling]

# --- Separate play for token-based query ---
# x_auth_token is mutually exclusive with idrac_user/idrac_password.
# The module uses env_fallback for IDRAC_USERNAME/IDRAC_PASSWORD environment
# variables. When those env vars are set, they conflict with x_auth_token.
#
# To run the token-based query, ensure IDRAC_USERNAME and IDRAC_PASSWORD
# env vars are NOT set in the shell. For example:
#   unset IDRAC_USERNAME IDRAC_PASSWORD
#   export IDRAC_X_AUTH_TOKEN="<your_token>"
#   ansible-playbook playbooks/idrac/idrac_network_attribute_registry.yml \
#     --tags query_with_token -e idrac_ip=192.168.0.1 -e network_device_function_id=NIC.Integrated.1-1-1
#
# When running the full playbook with credentials, the token query is
# skipped if IDRAC_PASSWORD is detected in the environment.
- name: iDRAC Token-Based Registry Query
  hosts: localhost
  gather_facts: false
  vars:
    idrac_ip: "{{ lookup('env', 'IDRAC_IP') | default('192.168.0.1', true) }}"
    validate_certs: false
    network_device_function_id: "{{ lookup('env', 'NIC_ID') | default('NIC.Integrated.1-1-1', true) }}"
    has_credential_env_vars: "{{ lookup('env', 'IDRAC_PASSWORD') | length > 0 }}"

  tasks:
    - name: Skip token query (IDRAC_PASSWORD env var is set)
      ansible.builtin.debug:
        msg: >-
          Skipping token-based query because IDRAC_PASSWORD env var is set.
          The module's env_fallback makes idrac_password and x_auth_token mutually exclusive.
          To test token auth, unset IDRAC_PASSWORD and IDRAC_USERNAME before running.
      when: has_credential_env_vars | bool
      tags: [query_with_token]

    - name: Query registry using established session token
      dellemc.openmanage.idrac_network_attribute_registry:
        idrac_ip: "{{ idrac_ip }}"
        x_auth_token: "{{ saved_x_auth_token }}"
        network_device_function_id: "{{ network_device_function_id }}"
        query_type: "all"
        validate_certs: "{{ validate_certs }}"
      register: token_query_result
      when: saved_x_auth_token is defined and not (has_credential_env_vars | bool)
      tags: [query_with_token]

    - name: Display token query result
      ansible.builtin.debug:
        msg: "Attributes via token: {{ token_query_result.attribute_count }}"
      when: token_query_result is defined and token_query_result is not skipped
      tags: [query_with_token]
