# Sample playbook: idrac_session_info
# Demonstrates querying iDRAC session information, filtering, and stale detection.

- name: Query iDRAC session information
  hosts: idrac
  gather_facts: false

  tasks:
    # Query all active sessions
    - name: Get all active sessions
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
      register: all_sessions

    - name: Display all sessions
      ansible.builtin.debug:
        var: all_sessions

    # Filter sessions by Redfish type
    - name: Get Redfish sessions only
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        session_type: Redfish
      register: redfish_sessions

    - name: Display Redfish session count
      ansible.builtin.debug:
        msg: "Found {{ redfish_sessions.session_count }} Redfish sessions"

    # Filter sessions by username
    - name: Get sessions for a specific user
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        username_filter: root
      register: root_sessions

    - name: Display root user sessions
      ansible.builtin.debug:
        var: root_sessions.sessions

    # Detect stale sessions (older than 24 hours)
    - name: Find stale sessions older than 24 hours
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        stale_threshold_minutes: 1440
      register: stale_check

    - name: Display stale sessions
      ansible.builtin.debug:
        msg: "Stale sessions: {{ stale_check.sessions | selectattr('is_stale', 'equalto', true) | list }}"

    # Display session limits and utilization
    - name: Show session utilization
      ansible.builtin.debug:
        msg: >-
          Session utilization: {{ all_sessions.session_limits.active_sessions }}/{{ all_sessions.session_limits.max_sessions }}
          ({{ all_sessions.session_limits.utilization_percent }}%)

    # Combined filtering example
    - name: Combined filter - Redfish sessions for admin user with stale detection
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        session_type: Redfish
        username_filter: admin
        stale_threshold_minutes: 60
      register: combined_result

    - name: Display combined filter results
      ansible.builtin.debug:
        var: combined_result

    # Check mode example
    - name: Query sessions in check mode (no changes, read-only)
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
      check_mode: true
      register: check_result

    - name: Verify check mode produces same output
      ansible.builtin.assert:
        that:
          - not check_result.changed
        success_msg: "Check mode works correctly for read-only module"

    # Troubleshooting: Max Sessions Reached
    - name: Check if max sessions reached
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
      register: session_status

    - name: Warn if session utilization is high
      ansible.builtin.debug:
        msg: >-
          WARNING: iDRAC session utilization is at {{ session_status.session_limits.utilization_percent }}%.
          Active: {{ session_status.session_limits.active_sessions }}/{{ session_status.session_limits.max_sessions }}.
          Consider cleaning up stale sessions.
      when: session_status.session_limits.utilization_percent | int >= 80

    # Nightly stale session cleanup
    - name: Find stale sessions older than 8 hours for cleanup
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        stale_threshold_minutes: 480
      register: stale_sessions

    - name: Display stale sessions eligible for cleanup
      ansible.builtin.debug:
        msg: "Found {{ stale_sessions.sessions | selectattr('is_stale', 'equalto', true) | list | length }} stale sessions to clean up"

- name: Fleet-wide session monitoring (UC-2)
  hosts: idrac
  gather_facts: false
  serial: 20

  tasks:
    - name: Query session utilization across fleet
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
      register: fleet_sessions

    - name: Report servers with high session utilization
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ fleet_sessions.session_limits.active_sessions }}/{{ fleet_sessions.session_limits.max_sessions }}
          ({{ fleet_sessions.session_limits.utilization_percent }}%)
      when: fleet_sessions.session_limits.utilization_percent | int >= 50

- name: Export session data to CSV report
  hosts: idrac
  gather_facts: false

  tasks:
    - name: Query all sessions for report
      dellemc.openmanage.idrac_session_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ validate_certs | default(false) }}"
      register: all_sessions

    # Convert JSON output to CSV using Jinja2 template
    - name: Export session data as CSV
      ansible.builtin.copy:
        content: |
          Id,UserName,SessionType,ClientOriginIPAddress,CreatedTime,SessionAge
          {% for s in all_sessions.sessions %}
          {{ s.Id }},{{ s.UserName }},{{ s.SessionType }},{{ s.ClientOriginIPAddress }},{{ s.CreatedTime }},{{ s.session_age_minutes }}min
          {% endfor %}
        dest: "/tmp/idrac_sessions_report.csv"
        mode: "0644"
      delegate_to: localhost
