minor_changes:
  - idrac_network_attribute_registry - New module to query and validate iDRAC network attribute registry
    with support for all/redfish/oem query types, wildcard pattern filtering, batch attribute validation,
    and multi-generation detection across PowerEdge 16G-17G servers
    (https://github.com/dell/dellemc-openmanage-ansible-modules/issues/25620).
  - idrac_network_attribute_registry - Add X-Auth token session reuse, within-playbook registry caching
    with force_refresh bypass, and per-target error aggregation for multi-target loop playbooks
    (https://github.com/dell/dellemc-openmanage-ansible-modules/issues/25620).
