--- 


- name: Testing IDRAC secure boot playbook
  connection: local
  gather_facts: false
  hosts: localhost

  module_defaults:
    dellemc.openmanage.idrac_server_config_profile:
    # dellemc.openmanage.idrac_lifecycle_controller_status_info:
      idrac_ip: "100.68.148.208"
      #100.71.90.118
      # idrac_ip: "100.68.148.87"
      idrac_user: "root"
      idrac_password: "calvin"
      idrac_port: 443
      # idrac_password: "calvin"
      validate_certs: false
  vars:
    path_for_secure_boot_certificate: "/root/ansible_collections/dellemc/openmanage/playput/secure_boot_certitifate_path_1"
    idrac_ip: "100.68.148.208"
    idrac_port: 443
    validate_certs: false
    idrac_user: "root"
    idrac_password: "calvin"
  tasks:
    - name: Create a new iDRAC user by uri.
      ansible.builtin.uri:
        url: https://{{ idrac_ip|ansible.utils.ipwrap }}:{{ idrac_port }}/redfish/v1/Managers/iDRAC.Embedded.1/Oem/Dell/DellAttributes/iDRAC.Embedded.1/
        method: PATCH
        body:
          Attributes:
            Users.7.UserName: "Anika" 
            Users.7.Password: "Dell123&"
        body_format: json
        validate_certs: false
        url_username: "root"
        url_password: "calvin"
        status_code: 200
        headers: 'Accept=application/json'
      register: user_uri

    - name: Delete the iDRAC user by uri.
      ansible.builtin.uri:
        url: https://{{ idrac_ip|ansible.utils.ipwrap }}:{{ idrac_port }}/redfish/v1/AccountService/Accounts/7
        method: DELETE
        validate_certs: false
        url_username: "root"
        url_password: "calvin"
        status_code: 204
        headers: 'Accept=application/json'
      register: user_uri
