---
# Integration test for returning validation results structure
# Test Case: test_validation_structure
# Gherkin Scenario: Return validation results structure (AC-006)
# FR Reference: FR-4.1
# This test verifies that the module returns validation results
# in the correct structure with per-attribute status, reason,
# and optional suggestions.
- name: Validate attributes to check structure
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    validate: true
    attributes:
      ProcVirtualization: "Enabled"
      ProcXYZ: "value"
  register: validation_result

- name: Verify module succeeded
  ansible.builtin.assert:
    that:
      - validation_result is not failed
      - validation_result is succeeded

- name: Verify validation results structure
  ansible.builtin.assert:
    that:
      - validation_result.validation_results is defined
      - validation_result.validation_results is iterable

- name: Verify each validation result has required fields
  ansible.builtin.assert:
    that:
      - item.attribute is defined
      - item.status is defined
      - item.status in ["valid", "invalid"]
      - item.reason is defined
  loop: "{{ validation_result.validation_results }}"
  loop_control:
    label: "{{ item.attribute }}"

- name: Verify validation summary fields
  ansible.builtin.assert:
    that:
      - validation_result.valid is defined
      - validation_result.valid is boolean
      - validation_result.valid_count is defined
      - validation_result.valid_count is number
      - validation_result.invalid_count is defined
      - validation_result.invalid_count is number

- name: Verify suggestions field exists for invalid entries
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('status', 'equalto', 'invalid') | map(attribute='suggestions') | list | first is defined
  when: validation_result.invalid_count > 0

- name: Display validation structure summary
  ansible.builtin.debug:
    msg:
      - "Valid: {{ validation_result.valid }}"
      - "Valid Count: {{ validation_result.valid_count }}"
      - "Invalid Count: {{ validation_result.invalid_count }}"
      - "Validation Results: {{ validation_result.validation_results }}"
