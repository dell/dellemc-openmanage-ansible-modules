---
# Integration test for validating valid enumeration attribute
# Test Case: test_validate_enum_valid
# Gherkin Scenario: Validate valid enumeration attribute (AC-003)
# FR Reference: FR-2.1
# This test verifies that the module correctly validates a valid enumeration
# attribute value and returns validation results.
- name: Validate valid enumeration attribute
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    validate: true
    attributes:
      BootMode: "Uefi"
  register: validation_result

- name: Verify module succeeded
  assert:
    that:
      - validation_result is not failed
      - validation_result is succeeded

- name: Verify validation result is true
  assert:
    that:
      - validation_result.valid is defined
      - validation_result.valid is true

- name: Verify validation results structure
  assert:
    that:
      - validation_result.validation_results is defined
      - validation_result.validation_results is iterable

- name: Verify BootMode validation status
  assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'BootMode') | map(attribute='status') | list | first == "valid"

- name: Verify validation counts
  assert:
    that:
      - validation_result.valid_count is defined
      - validation_result.valid_count == 1
      - validation_result.invalid_count is defined
      - validation_result.invalid_count == 0

- name: Display validation summary
  debug:
    msg:
      - "Valid: {{ validation_result.valid }}"
      - "Valid Count: {{ validation_result.valid_count }}"
      - "Invalid Count: {{ validation_result.invalid_count }}"
      - "Validation Results: {{ validation_result.validation_results }}"
