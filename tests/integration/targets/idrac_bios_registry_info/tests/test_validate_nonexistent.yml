---
# Integration test for detecting non-existent attribute name
# Test Case: test_validate_nonexistent
# Gherkin Scenario: Detect non-existent attribute name (AC-003)
# FR Reference: FR-2.1
# This test verifies that the module correctly detects a non-existent
# attribute name and returns validation results with error message.
- name: Validate non-existent attribute name
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    validate: true
    attributes:
      NonExistentAttr: "value"
  register: validation_result

- name: Verify module succeeded
  ansible.builtin.assert:
    that:
      - validation_result is not failed
      - validation_result is succeeded

- name: Verify validation result is false
  ansible.builtin.assert:
    that:
      - validation_result.valid is defined
      - validation_result.valid is false

- name: Verify validation results structure
  ansible.builtin.assert:
    that:
      - validation_result.validation_results is defined
      - validation_result.validation_results is iterable

- name: Verify NonExistentAttr validation status
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'NonExistentAttr') | map(attribute='status') | list | first == "invalid"

- name: Verify error reason
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'NonExistentAttr') | map(attribute='reason') | list | first is search("not found in BIOS registry")

- name: Verify validation counts
  ansible.builtin.assert:
    that:
      - validation_result.valid_count is defined
      - validation_result.valid_count == 0
      - validation_result.invalid_count is defined
      - validation_result.invalid_count == 1

- name: Display validation summary
  debug:
    msg:
      - "Valid: {{ validation_result.valid }}"
      - "Valid Count: {{ validation_result.valid_count }}"
      - "Invalid Count: {{ validation_result.invalid_count }}"
      - "Validation Results: {{ validation_result.validation_results }}"
