---
# Integration test for authentication failure
# Note: This test requires invalid credentials to trigger authentication failure
- name: Test authentication failure with invalid credentials
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "invalid_user"
    idrac_password: "invalid_password"
    idrac_port: "{{ idrac_port }}"
    validate_certs: "{{ validate_certs }}"
  register: auth_result
  ignore_errors: true

- name: Verify authentication failure error
  ansible.builtin.assert:
    that:
      - auth_result is failed
      - "'Authentication failed' in auth_result.msg or 'Unauthorized' in auth_result.msg or 'Forbidden' in auth_result.msg"
  when: auth_result is failed
