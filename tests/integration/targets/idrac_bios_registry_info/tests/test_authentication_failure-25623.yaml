---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- block:
    - name: Test authentication failure with invalid credentials
      dellemc.openmanage.idrac_bios_registry_info:
        idrac_user: "invalid_user"
        idrac_password: "invalid_password"
      register: auth_result
      ignore_errors: true

    - name: Verify authentication failure error
      ansible.builtin.assert:
        that:
          - auth_result is failed
          - "'Authentication failed' in auth_result.msg or 'Network error' in auth_result.msg"

  module_defaults:
    dellemc.openmanage.idrac_bios_registry_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
