---
# Integration test for attribute validation
- name: Test BIOS attribute validation
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port }}"
    validate_certs: "{{ validate_certs }}"
    validate: true
    attributes:
      ProcVirtualization: "Enabled"
      MemTest: "Disabled"
  register: validation_result

- name: Verify validation results
  ansible.builtin.assert:
    that:
      - validation_result is success
      - validation_result.changed == false
      - validation_result.valid is defined
      - validation_result.valid_count is defined
      - validation_result.invalid_count is defined
