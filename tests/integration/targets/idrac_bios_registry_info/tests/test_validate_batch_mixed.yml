---
# Integration test for batch validation with mixed valid and invalid
# Test Case: test_validate_batch_mixed
# Gherkin Scenario: Batch validation with mixed valid and invalid (AC-008)
# FR Reference: FR-2.3
# This test verifies that the module correctly validates multiple
# attributes with mixed validity in a single operation.
- name: Batch validation with mixed valid and invalid
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    validate: true
    attributes:
      SecureBoot: "INVALID"
      ProcVirtualization: "Enabled"
      FakeAttribute: "value"
  register: validation_result

- name: Verify module succeeded
  ansible.builtin.assert:
    that:
      - validation_result is not failed
      - validation_result is succeeded

- name: Verify validation result is false
  ansible.builtin.assert:
    that:
      - validation_result.valid is defined
      - validation_result.valid is false

- name: Verify validation results structure
  ansible.builtin.assert:
    that:
      - validation_result.validation_results is defined
      - validation_result.validation_results is iterable
      - validation_result.validation_results | length == 3

- name: Verify validation counts
  ansible.builtin.assert:
    that:
      - validation_result.valid_count is defined
      - validation_result.valid_count == 1
      - validation_result.invalid_count is defined
      - validation_result.invalid_count == 2

- name: Verify per-attribute status
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'SecureBoot')
        | map(attribute='status') | list | first == "invalid"
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'ProcVirtualization')
        | map(attribute='status') | list | first == "valid"
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'FakeAttribute')
        | map(attribute='status') | list | first == "invalid"

- name: Display validation summary
  ansible.builtin.debug:
    msg:
      - "Valid: {{ validation_result.valid }}"
      - "Valid Count: {{ validation_result.valid_count }}"
      - "Invalid Count: {{ validation_result.invalid_count }}"
      - "Validation Results: {{ validation_result.validation_results }}"
