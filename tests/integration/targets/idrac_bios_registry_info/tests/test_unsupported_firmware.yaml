---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- block:
    - name: Test unsupported firmware version
      dellemc.openmanage.idrac_bios_registry_info: {}
      register: firmware_result
      ignore_errors: true

    - name: Verify unsupported firmware error
      ansible.builtin.assert:
        that:
          - firmware_result is failed
          - 'firmware_result.msg is search("BIOS attribute registry not supported on this firmware version")'
          - 'firmware_result.msg is search("Minimum required")'
      when: firmware_result is failed

  module_defaults:
    dellemc.openmanage.idrac_bios_registry_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
