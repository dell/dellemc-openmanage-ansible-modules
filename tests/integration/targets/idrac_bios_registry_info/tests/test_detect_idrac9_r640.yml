---
# Integration test for detecting iDRAC9 on R640
# Test Case: test_detect_idrac9_r640
# Gherkin Scenario: Detect iDRAC9 on R640 (AC-005)
# FR Reference: FR-1.2
# This test verifies that the module correctly detects iDRAC9 on R640 (14G)
# and returns the correct generation and model information.
- name: Query BIOS attributes on R640
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: query_result

- name: Verify module succeeded
  ansible.builtin.assert:
    that:
      - query_result is not failed
      - query_result is succeeded

- name: Verify iDRAC generation detection
  ansible.builtin.assert:
    that:
      - query_result.idrac_generation is defined
      - query_result.idrac_generation == 14

- name: Verify firmware version returned
  ansible.builtin.assert:
    that:
      - query_result.idrac_firmware_version is defined
      - query_result.idrac_firmware_version is string

- name: Verify iDRAC model
  ansible.builtin.assert:
    that:
      - query_result.idrac_model is defined
      - query_result.idrac_model == "iDRAC 9"

- name: Display detection summary
  debug:
    msg:
      - "iDRAC Generation: {{ query_result.idrac_generation }}"
      - "iDRAC Firmware: {{ query_result.idrac_firmware_version }}"
      - "iDRAC Model: {{ query_result.idrac_model }}"
