---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- name: Check iDRAC firmware version
  ansible.builtin.include_tasks: _check_idrac_version.yml

- block:
    - name: Query BIOS attributes for full schema
      dellemc.openmanage.idrac_bios_registry_info: {}
      register: schema_result

    - name: Verify module succeeded
      ansible.builtin.assert:
        that:
          - schema_result is not failed
          - schema_result is succeeded

    - name: Verify required output fields
      ansible.builtin.assert:
        that:
          - schema_result.bios_attributes is defined
          - schema_result.bios_attributes is iterable
          - schema_result.attribute_count is defined

    - name: Verify non-empty results
      ansible.builtin.assert:
        that:
          - schema_result.attribute_count | int > 0
          - schema_result.bios_attributes | length == schema_result.attribute_count | int

    - name: Verify attribute has all required schema fields
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.display_name is defined
          - item.type is defined
          - item.current_value is defined
          - item.default_value is defined
          - item.valid_values is defined
          - item.description is defined
          - item.is_oem is defined
          - item.read_only is defined
          - item.immutable is defined
          - item.write_only is defined
          - item.gray_out is defined
          - item.hidden is defined
          - item.group is defined
          - item.menu_path is defined
          - item.lower_bound is defined
          - item.upper_bound is defined
          - item.min_length is defined
          - item.max_length is defined
          - item.scalar_increment is defined
          - item.regex is defined
          - item.value_expression is defined
          - item.warning_text is defined
          - item.display_order is defined
      loop: "{{ schema_result.bios_attributes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Verify changed flag is false (read-only operation)
      ansible.builtin.assert:
        that:
          - schema_result.changed is defined
          - schema_result.changed is false

    - name: Display schema summary
      ansible.builtin.debug:
        msg:
          - "Attribute Count: {{ schema_result.attribute_count }}"
          - "Registry Version: {{ schema_result.registry_version }}"

  module_defaults:
    dellemc.openmanage.idrac_bios_registry_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
