---
# Integration test for detecting invalid enumeration value
# Test Case: test_validate_enum_invalid
# Gherkin Scenario: Detect invalid enumeration value (AC-003)
# FR Reference: FR-2.1
# This test verifies that the module correctly detects an invalid enumeration
# value and returns validation results with error messages and suggestions.
- name: Validate invalid enumeration value
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port | default(443) }}"
    validate_certs: "{{ validate_certs | default(true) }}"
    validate: true
    attributes:
      ProcVirtualization: "INVALID"
  register: validation_result

- name: Verify module succeeded
  ansible.builtin.assert:
    that:
      - validation_result is not failed
      - validation_result is succeeded

- name: Verify validation result is false
  ansible.builtin.assert:
    that:
      - validation_result.valid is defined
      - validation_result.valid is false

- name: Verify validation results structure
  ansible.builtin.assert:
    that:
      - validation_result.validation_results is defined
      - validation_result.validation_results is iterable

- name: Verify ProcVirtualization validation status
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'ProcVirtualization') | map(attribute='status') | list | first == "invalid"

- name: Verify error reason
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'ProcVirtualization') | map(attribute='reason') | list | first is search("not a valid enumeration value")

- name: Verify suggestions provided
  ansible.builtin.assert:
    that:
      - validation_result.validation_results | selectattr('attribute', 'equalto', 'ProcVirtualization') | map(attribute='suggestions') | list | first is defined

- name: Verify validation counts
  ansible.builtin.assert:
    that:
      - validation_result.valid_count is defined
      - validation_result.valid_count == 0
      - validation_result.invalid_count is defined
      - validation_result.invalid_count == 1

- name: Display validation summary
  debug:
    msg:
      - "Valid: {{ validation_result.valid }}"
      - "Valid Count: {{ validation_result.valid_count }}"
      - "Invalid Count: {{ validation_result.invalid_count }}"
      - "Validation Results: {{ validation_result.validation_results }}"
