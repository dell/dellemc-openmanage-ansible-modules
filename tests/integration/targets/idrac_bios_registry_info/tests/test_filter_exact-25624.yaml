---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- name: Check iDRAC firmware version
  ansible.builtin.include_tasks: _check_idrac_version.yml

- block:
    - name: Query BIOS attribute by exact name
      dellemc.openmanage.idrac_bios_registry_info:
        attribute_name: "ProcVirtualization"
      register: filter_result

    - name: Verify module succeeded
      ansible.builtin.assert:
        that:
          - filter_result is not failed
          - filter_result is succeeded

    - name: Verify required output fields
      ansible.builtin.assert:
        that:
          - filter_result.bios_attributes is defined
          - filter_result.bios_attributes is iterable
          - filter_result.attribute_count is defined
          - filter_result.attribute_count is number

    - name: Verify exactly one attribute
      ansible.builtin.assert:
        that:
          - filter_result.attribute_count | int == 1
          - filter_result.bios_attributes | length == 1

    - name: Verify attribute name is ProcVirtualization
      ansible.builtin.assert:
        that:
          - filter_result.bios_attributes[0].name == "ProcVirtualization"

    - name: Verify changed flag is false (read-only operation)
      ansible.builtin.assert:
        that:
          - filter_result.changed is defined
          - filter_result.changed is false

    - name: Display filter summary
      ansible.builtin.debug:
        msg:
          - "Attribute Count: {{ filter_result.attribute_count }}"
          - "Attribute Name: {{ filter_result.bios_attributes[0].name }}"

  module_defaults:
    dellemc.openmanage.idrac_bios_registry_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
