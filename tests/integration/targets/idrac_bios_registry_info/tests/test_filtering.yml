---
# Integration test for attribute filtering
- name: Test BIOS attribute filtering by name pattern
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port }}"
    validate_certs: "{{ validate_certs }}"
    attribute_name: "Proc*"
  register: filter_result

- name: Verify filtering by name pattern
  ansible.builtin.assert:
    that:
      - filter_result is success
      - filter_result.changed == false
      - filter_result.bios_attributes is defined
      - filter_result.attribute_count is defined

- name: Test BIOS attribute filtering by category
  dellemc.openmanage.idrac_bios_registry_info:
    idrac_ip: "{{ idrac_ip }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    idrac_port: "{{ idrac_port }}"
    validate_certs: "{{ validate_certs }}"
    category: "Processor"
  register: category_filter_result

- name: Verify filtering by category
  ansible.builtin.assert:
    that:
      - category_filter_result is success
      - category_filter_result.changed == false
      - category_filter_result.bios_attributes is defined
