---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- block:
    - name: Query attributes (firmware check is implicit)
      dellemc.openmanage.idrac_network_attribute_registry:
        query_type: "all"
      register: query_result

    - name: Verify firmware info is returned
      ansible.builtin.assert:
        that:
          - query_result.firmware_version is defined
          - query_result.firmware_version is string
          - query_result.idrac_model is defined
          - query_result.idrac_model is string
        fail_msg: "Firmware version or iDRAC model not returned in output"

    - name: Display firmware information
      ansible.builtin.debug:
        msg:
          - "Firmware Version: {{ query_result.firmware_version }}"
          - "iDRAC Model: {{ query_result.idrac_model }}"

  module_defaults:
    dellemc.openmanage.idrac_network_attribute_registry:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
