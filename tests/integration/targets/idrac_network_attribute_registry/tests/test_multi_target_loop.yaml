---
# Test: Multi-target loop with per-target error aggregation (AC6 / FR-1)
# Verifies that the module can be used in a loop over multiple targets
# and returns per-target results with error status

- name: "Test multi-target - Query multiple iDRAC targets"
  dellemc.openmanage.idrac_network_attribute_registry:
    idrac_ip: "{{ item }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    query_type: "all"
    validate_certs: "{{ validate_certs }}"
  loop: "{{ idrac_targets | default([idrac_ip]) }}"
  register: multi_results
  ignore_errors: true

- name: "Verify multi-target results structure"
  ansible.builtin.assert:
    that:
      - multi_results.results is defined
      - multi_results.results | length > 0
    fail_msg: "Multi-target results missing or empty"

- name: "Verify each target has required fields"
  ansible.builtin.assert:
    that:
      - item.msg is defined
      - item.changed == false
    fail_msg: "Target {{ item.item }} missing required fields"
  loop: "{{ multi_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Test multi-target - Mixed success/failure with unreachable target"
  dellemc.openmanage.idrac_network_attribute_registry:
    idrac_ip: "{{ item }}"
    idrac_user: "{{ idrac_user }}"
    idrac_password: "{{ idrac_password }}"
    query_type: "all"
    validate_certs: "{{ validate_certs }}"
    timeout: 5
  loop:
    - "{{ idrac_ip }}"
    - "192.168.255.254"
  register: mixed_results
  ignore_errors: true

- name: "Verify first target succeeded"
  ansible.builtin.assert:
    that:
      - mixed_results.results[0].failed == false
      - mixed_results.results[0].attribute_count is defined
    fail_msg: "First target should have succeeded"

- name: "Verify second target failed (unreachable)"
  ansible.builtin.assert:
    that:
      - mixed_results.results[1].failed == true or mixed_results.results[1].unreachable is defined
    fail_msg: "Second target should have failed or been unreachable"

- name: "Aggregate results programmatically"
  ansible.builtin.set_fact:
    successful: "{{ mixed_results.results | selectattr('failed', 'equalto', false) | list }}"
    failed: "{{ mixed_results.results | selectattr('failed', 'equalto', true) | list }}"

- name: "Verify aggregation works"
  ansible.builtin.assert:
    that:
      - successful | length >= 1
    fail_msg: "At least one target should have succeeded"
