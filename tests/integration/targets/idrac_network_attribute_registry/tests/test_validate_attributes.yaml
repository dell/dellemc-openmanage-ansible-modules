---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- block:
    - name: Validate known valid attribute
      dellemc.openmanage.idrac_network_attribute_registry:
        query_type: "validate"
        validate_attributes:
          VLanMode: "Enabled"
      register: valid_result

    - name: Verify validation succeeded
      ansible.builtin.assert:
        that:
          - valid_result is not failed
          - valid_result.validation_results is defined
          - valid_result.validation_results | length == 1

    - name: Validate with intentionally misspelled attribute name
      dellemc.openmanage.idrac_network_attribute_registry:
        query_type: "validate"
        validate_attributes:
          VLanMod: "Enabled"
      register: invalid_name_result

    - name: Verify invalid name returns fail with suggestions
      ansible.builtin.assert:
        that:
          - invalid_name_result is not failed
          - invalid_name_result.validation_results is defined
          - invalid_name_result.validation_results[0].status == "fail"
          - invalid_name_result.validation_results[0].suggested_corrections is defined

    - name: Validate with invalid attribute value
      dellemc.openmanage.idrac_network_attribute_registry:
        query_type: "validate"
        validate_attributes:
          VLanMode: "InvalidValue"
      register: invalid_value_result

    - name: Verify invalid value returns fail with valid values
      ansible.builtin.assert:
        that:
          - invalid_value_result is not failed
          - invalid_value_result.validation_results is defined
          - invalid_value_result.validation_results[0].status == "fail"
          - "'Valid values' in invalid_value_result.validation_results[0].error_message"

    - name: Display validation results
      ansible.builtin.debug:
        msg:
          - "Valid result: {{ valid_result.validation_results }}"
          - "Invalid name result: {{ invalid_name_result.validation_results }}"
          - "Invalid value result: {{ invalid_value_result.validation_results }}"

  module_defaults:
    dellemc.openmanage.idrac_network_attribute_registry:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
      network_device_function_id: "{{ network_device_function_id }}"
