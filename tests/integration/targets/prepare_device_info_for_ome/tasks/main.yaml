- block:
  - name: Identify if target is OME or OME-M
    ansible.builtin.uri:
      url: "https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/api"
      user: "{{ username }}"
      password: "{{ password }}"
      validate_certs: false
      status_code: 200
    register: target_identification

  - ansible.builtin.set_fact:
      target_host: "OME"

  - ansible.builtin.set_fact:
      target_host: "OME-M"
    when: "'DiscoveryConfigService' not in target_identification.json | string"

  - name: Get the device service tag of a server present under idrac group in inventory.
    dellemc.openmanage.ome_device_info:
    register: all_devices
    ignore_errors: true

  - name: Pre-req - Discover Server 1
    dellemc.openmanage.ome_discovery:
      discovery_job_name: "pre_discovery_task_deivce_1_for_omam_tests"
      discovery_config_targets:
      - network_address_detail:
        - "{{ device_ip }}"
        device_types:
        - SERVER
        wsman:
          username: "{{ device_user }}"
          password: "{{ device_password }}"
    when:
    - target_host != "OME-M" and device_ip not in all_devices | string

  - name: Pre-req - Discover Server 2
    dellemc.openmanage.ome_discovery:
      discovery_job_name: "pre_discovery_task_for_device_2_omam_tests"
      discovery_config_targets:
      - network_address_detail:
        - "{{ device_ip_2 }}"
        device_types:
        - SERVER
        wsman:
          username: "{{ device_user_2 }}"
          password: "{{ device_password_2 }}"
    when:
    - target_host != "OME-M" and device_ip_2 not in all_devices | string

  - name: Get the device service tag of a server present under idrac group in inventory.
    dellemc.openmanage.ome_device_info:
    register: all_devices

  - ansible.builtin.set_fact:
      device_info: "{{all_devices | json_query(query)}}"
    vars:
      query: 'device_info.value[?DeviceManagement[?NetworkAddress == `{{ device_ip }}`]]'
    when: device_ip is defined

  - ansible.builtin.set_fact:
      device_service_tag: "{{ device_info[0].DeviceServiceTag }}"
      device_id: "{{ device_info[0].Id }}"
    when: device_ip is defined

  - ansible.builtin.set_fact:
      device_info_2: "{{ all_devices | json_query(query) }}"
    vars:
      query: 'device_info.value[?DeviceManagement[?NetworkAddress == `{{ device_ip_2 }}`]]'
    when: device_ip_2 is defined

  - ansible.builtin.set_fact:
      device_service_tag_2: "{{ device_info_2[0].DeviceServiceTag }}"
      device_id_2: "{{ device_info_2[0].Id }}"
    when: device_ip_2 is defined

  - name: Get device software details for {{device_service_tag}} by uri.
    ansible.builtin.uri:
      url: "https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/api/DeviceService/Devices({{ device_id }})/InventoryDetails('deviceSoftware')"
      user: "{{ username }}"
      password: "{{ password }}"
      validate_certs: false
      status_code: 200
    register: device_software_details_device_1
    when: device_ip is defined

  - ansible.builtin.set_fact:
      idrac_firmware_details: "{{device_software_details_device_1.json.InventoryInfo | json_query(query) | first}}"
    vars:
      query: '[?DeviceDescription == `Lifecycle Controller`]'
    when: device_ip is defined

  - include_tasks: _unassign_helper.yml

  - name: Delete group with name omam_test_group.
    dellemc.openmanage.ome_groups:
      state: "absent"
      name: "omam_test_group"
    when: "'OME-M' not in target_host"

  - name: create a group with name omam_test_group.
    dellemc.openmanage.ome_groups:
      name: "omam_test_group"
    when: "'OME-M' not in target_host"

  - name: Add devices to group with name omam_test_group.
    dellemc.openmanage.ome_device_group:
      name: "omam_test_group"
      ip_addresses: [ "{{ device_ip }}" ]
    when: "'OME-M' not in target_host"

  module_defaults:
    dellemc.openmanage.ome_device_info:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname | ansible.utils.ipwrap }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{port}}"
    dellemc.openmanage.ome_discovery:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname | ansible.utils.ipwrap }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
    dellemc.openmanage.ome_groups:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname | ansible.utils.ipwrap }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
    dellemc.openmanage.ome_device_group:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname | ansible.utils.ipwrap }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
