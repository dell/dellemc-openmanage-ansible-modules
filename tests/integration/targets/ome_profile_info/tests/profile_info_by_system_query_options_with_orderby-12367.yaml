- name: Test that we have an OME host, OME username and OME password
  fail:
    msg: 'Please define the following variables: hostname, username and password.'
  when: hostname is not defined or username is not defined or password is not defined

- block:
  - include_tasks: _delete_template_helper.yml

  - include_tasks: _create_template_helper.yml

  - include_tasks: _create_profile_helper.yml

  - include_tasks: _profile_info_uri_helper.yml
    vars:
      profile_id: "{{ create.profile_ids[0] }}"

  - name: Retrieval of Profile information by "orderby = ProfileName" (Check mode)
    ome_profile_info:
      system_query_options:
        orderby: ProfileName
    register: result
    check_mode: true

  - set_fact:
      task_profile_info: "{{ result.profile_info[0] }}"

  - name: Verify task status - Retrieval of Profile information by "orderby = ProfileName" Check mode)
    assert:
      that:
      - not result.changed
      - result.msg == "Successfully retrieved the profile information."

  - name: Compare profile info from task and uri (Check mode)
    ansible.utils.fact_diff:
      before: "{{ uri_profile_info }}"
      after: "{{ task_profile_info }}"
    register: diff_result

  - name: Verify task status - Compare profile info from task and uri (Check mode)
    assert:
      that:
      - not diff_result.changed
      - not diff_result.diff_lines

  - name: Retrieval of Profile information by "orderby = ProfileName" (Normal mode)
    ome_profile_info:
      system_query_options:
        orderby: ProfileName
    register: result

  - set_fact:
      task_profile_info: "{{ result.profile_info[0] }}"

