- name: Track job.
  ome_job_info:
    validate_certs: "{{validate_certs}}"
    hostname: "{{hostname}}"
    username: "{{username}}"
    password: "{{password}}"
    port: "{{port}}"
    job_id: "{{job_id}}"
  register: job_result
  when: job_id is defined
  failed_when: job_result.job_info.LastRunStatus.Name == 'Failed' or job_result.job_info.LastRunStatus.Name == 'Warning' or job_result.job_info.LastRunStatus.Name == 'Running'
  changed_when: job_result.job_info.LastRunStatus.Name == 'Completed'
  until: job_result.job_info.LastRunStatus.Name == 'Completed' or job_result.job_info.LastRunStatus.Name == 'Failed' or job_result.job_info.LastRunStatus.Name == 'Warning'
  retries: "300"
  delay: "30"
