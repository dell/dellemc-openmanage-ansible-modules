---
# Test: MessageRegistry unavailable — graceful fallback
# Given: iDRAC with LC log service enabled and MessageRegistry is unavailable
# When: Module attempts to retrieve LC logs with enrichment enabled
# Then: Module returns log entries without enrichment and logs warning

- name: Test MessageRegistry unavailable graceful fallback
  tags:
    - message_registry_unavailable
  block:
    - name: Retrieve LC logs with MessageRegistry enrichment
      dellemc.openmanage.idrac_lifecycle_controller_logs:
        idrac_host: "{{ idrac_host }}"
        idrac_username: "{{ idrac_username }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ idrac_validate_certs }}"
        enrich_with_registry: true
      register: result

    - name: Verify graceful fallback succeeded
      assert:
        that:
          - result.failed is false
          - result.changed is false
          - result.results[0].lc_logs is defined
        fail_msg: "Graceful fallback failed"
        success_msg: "Graceful fallback completed successfully"
