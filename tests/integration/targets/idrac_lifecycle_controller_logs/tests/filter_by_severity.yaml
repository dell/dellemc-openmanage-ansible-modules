---
- name: Test filter by severity
  tags:
    - filter_by_severity
  block:
    - name: Retrieve LC logs filtered by severity
      dellemc.openmanage.idrac_lifecycle_controller_logs:
        idrac_host: "{{ idrac_host }}"
        idrac_username: "{{ idrac_username }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ idrac_validate_certs }}"
        severity: "{{ test_severity_filter }}"
      register: result

    - name: Verify severity filter applied
      assert:
        that:
          - result.failed is false
          - result.changed is false
          - result.results[0].lc_logs is defined
        fail_msg: "Severity filter failed"
        success_msg: "Severity filter applied successfully"

    - name: Verify all returned logs match severity filter
      assert:
        that:
          - item.severity in test_severity_filter
        fail_msg: "Log entry does not match severity filter"
        success_msg: "All log entries match severity filter"
      loop: "{{ result.results[0].lc_logs }}"
      when: result.results[0].lc_logs | length > 0
