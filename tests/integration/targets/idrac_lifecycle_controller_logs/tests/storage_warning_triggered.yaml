---
# Test: Storage warning triggered
# Given: iDRAC with LC log service enabled and storage utilization exceeds threshold
# When: Module queries metadata
# Then: Module returns warning about storage utilization

- name: Test storage warning triggered
  tags:
    - storage_warning_triggered
  block:
    - name: Query LC log metadata to check storage utilization
      dellemc.openmanage.idrac_lifecycle_controller_logs:
        idrac_host: "{{ idrac_host }}"
        idrac_username: "{{ idrac_username }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: "{{ idrac_validate_certs }}"
        query_metadata: true
      register: result

    - name: Verify storage warning is triggered
      assert:
        that:
          - result.failed is false
          - result.changed is false
          - result.results[0].metadata.storage_utilization_percent is defined
        fail_msg: "Storage warning check failed"
        success_msg: "Storage warning triggered correctly"
