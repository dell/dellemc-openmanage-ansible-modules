---
# Integration test tasks for idrac_lifecycle_controller_logs module

- name: Set module defaults
  ansible.builtin.set_fact:
    ansible_module_defaults:
      dellemc.openmanage.idrac_lifecycle_controller_logs:
        validate_certs: false

- name: Discover test cases
  ansible.builtin.set_fact:
    test_cases: "{{ lookup('fileglob', 'tests/*.yml') | sort }}"

- name: Display discovered test cases
  ansible.builtin.debug:
    var: test_cases

- name: Run discovered test cases
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ test_cases }}"
  loop_control:
    label: "{{ item | basename }}"
