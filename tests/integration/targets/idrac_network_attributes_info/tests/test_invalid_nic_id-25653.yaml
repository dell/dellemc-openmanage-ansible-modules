---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined

- name: Check iDRAC firmware version
  ansible.builtin.include_tasks: _check_idrac_version.yml

- block:
    - name: Query with invalid NIC ID
      dellemc.openmanage.idrac_network_attributes_info:
        network_device_function_id: "NIC.Fake.99-99-99"
      register: invalid_result
      ignore_errors: true

    - name: Verify module failed
      ansible.builtin.assert:
        that:
          - invalid_result is failed

    - name: Verify error message contains invalid NIC ID
      ansible.builtin.assert:
        that:
          - "'NIC.Fake.99-99-99' in invalid_result.msg"

    - name: Verify error message contains valid NIC IDs
      ansible.builtin.assert:
        that:
          - "'NIC.' in invalid_result.msg"

  module_defaults:
    dellemc.openmanage.idrac_network_attributes_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      idrac_port: "{{ idrac_port | default(443) }}"
      validate_certs: false
