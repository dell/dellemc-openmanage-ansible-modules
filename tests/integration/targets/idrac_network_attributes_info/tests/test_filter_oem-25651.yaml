---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user,
     idrac_password, and network_device_function_id.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined or network_device_function_id is not defined

- name: Check iDRAC firmware version
  ansible.builtin.include_tasks: _check_idrac_version.yml

- block:
    - name: Query OEM attributes only
      dellemc.openmanage.idrac_network_attributes_info:
        network_device_function_id: "{{ network_device_function_id }}"
        attribute_source: "oem"
      register: oem_result

    - name: Verify OEM filter returns results
      ansible.builtin.assert:
        that:
          - oem_result is not failed
          - oem_result.network_attributes | length > 0

    - name: Verify all returned attributes are OEM
      ansible.builtin.assert:
        that:
          - item.is_oem is true
      loop: "{{ oem_result.network_attributes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Query standard attributes only
      dellemc.openmanage.idrac_network_attributes_info:
        network_device_function_id: "{{ network_device_function_id }}"
        attribute_source: "standard"
      register: standard_result

    - name: Verify standard filter
      ansible.builtin.assert:
        that:
          - standard_result is not failed

    - name: Verify all returned standard attributes are not OEM
      ansible.builtin.assert:
        that:
          - item.is_oem is false
      loop: "{{ standard_result.network_attributes }}"
      loop_control:
        label: "{{ item.name }}"
      when: standard_result.network_attributes | length > 0

  module_defaults:
    dellemc.openmanage.idrac_network_attributes_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      idrac_port: "{{ idrac_port | default(443) }}"
      validate_certs: false
