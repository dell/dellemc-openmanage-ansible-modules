---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user,
     idrac_password, and network_device_function_id.'
  when: idrac_ip is not defined or idrac_user is not defined or
   idrac_password is not defined or network_device_function_id is not defined

- name: Check iDRAC firmware version
  ansible.builtin.include_tasks: _check_idrac_version.yml

- block:
    - name: Query attributes with glob pattern filter
      dellemc.openmanage.idrac_network_attributes_info:
        network_device_function_id: "{{ network_device_function_id }}"
        attribute_name: "VLan*"
      register: pattern_result

    - name: Verify pattern filter returns results
      ansible.builtin.assert:
        that:
          - pattern_result is not failed
          - pattern_result.changed is false

    - name: Verify all returned attributes match the glob pattern
      ansible.builtin.assert:
        that:
          - item.name is match("VLan.*")
      loop: "{{ pattern_result.network_attributes }}"
      loop_control:
        label: "{{ item.name }}"
      when: pattern_result.network_attributes | length > 0

    - name: Verify attribute_count matches results
      ansible.builtin.assert:
        that:
          - pattern_result.attribute_count == pattern_result.network_attributes | length

  module_defaults:
    dellemc.openmanage.idrac_network_attributes_info:
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      idrac_port: "{{ idrac_port | default(443) }}"
      validate_certs: false
