#
# Integration tests for ACME/SCEP CA certificate operations (Story-3129)
# AC-001: Import CA certificates of type ACME_CA_CERT and SCEP_CA_CERT
# AC-002: Delete CA certificates with idempotent behavior
# AC-003: View and export CA certificates
# AC-004: Graceful handling of unsupported firmware and missing license
# AC-005: Check mode and diff mode support
---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: 'idrac_ip is not defined or idrac_user is not defined or idrac_password
   is not defined'

- name: Ensure directory exists
  ansible.builtin.file:
    path: "{{ base_path_for_import_certificate }}"
    state: directory

- name: Download ACME CA certificate
  ansible.builtin.set_fact:
    curl_cmd: "curl -v --ntlm -u %s:%s -o %s %s"
    curl_acme_url: "{{ https_share_ip }}/{{ https_certificate_path }}{{ acme_ca_certificate_name }}"

- name: Downloading ACME CA certificate file
  register: acme_dnld_curl_cmd_out
  no_log: false
  changed_when: acme_dnld_curl_cmd_out.rc == 0
  failed_when: acme_dnld_curl_cmd_out.rc != 0
  ansible.builtin.command: >
      {{ curl_cmd | format(https_share_username, https_share_password,
       base_path_for_import_certificate + acme_ca_certificate_name, curl_acme_url) }}
  check_mode: false

- name: Download SCEP CA certificate
  ansible.builtin.set_fact:
    curl_scep_url: "{{ https_share_ip }}/{{ https_certificate_path }}{{ scep_ca_certificate_name }}"

- name: Downloading SCEP CA certificate file
  register: scep_dnld_curl_cmd_out
  no_log: false
  changed_when: scep_dnld_curl_cmd_out.rc == 0
  failed_when: scep_dnld_curl_cmd_out.rc != 0
  ansible.builtin.command: >
      {{ curl_cmd | format(https_share_username, https_share_password,
       base_path_for_import_certificate + scep_ca_certificate_name, curl_scep_url) }}
  check_mode: false

- block:
    # AC-001: Import ACME CA certificate - Check mode
    - name: Import ACME CA certificate - Check mode - Changes expected
      dellemc.openmanage.idrac_certificates:
        command: import
        certificate_type: "ACME_CA_CERT"
        certificate_path: "{{ base_path_for_import_certificate }}{{ acme_ca_certificate_name }}"
        reset: false
      register: import_acme_check
      check_mode: true

    - name: Verify status of task - import ACME CA certificate - check mode
      ansible.builtin.assert:
        that:
          - import_acme_check.changed
          - import_acme_check.msg == 'Changes found to be applied.'

    # AC-001: Import ACME CA certificate - Normal mode
    - name: Import ACME CA certificate - Normal mode
      dellemc.openmanage.idrac_certificates:
        command: import
        certificate_type: "ACME_CA_CERT"
        certificate_path: "{{ base_path_for_import_certificate }}{{ acme_ca_certificate_name }}"
        reset: false
      register: import_acme_result

    - ansible.builtin.set_fact:
        import_successful_msg: "Successfully performed the 'import' certificate operation."

    - name: Verify status of task - import ACME CA certificate - normal mode
      ansible.builtin.assert:
        that:
          - import_acme_result.changed
          - import_successful_msg in import_acme_result.msg

    # AC-001: Import SCEP CA certificate - Normal mode
    - name: Import SCEP CA certificate - Normal mode
      dellemc.openmanage.idrac_certificates:
        command: import
        certificate_type: "SCEP_CA_CERT"
        certificate_path: "{{ base_path_for_import_certificate }}{{ scep_ca_certificate_name }}"
        reset: false
      register: import_scep_result

    - name: Verify status of task - import SCEP CA certificate - normal mode
      ansible.builtin.assert:
        that:
          - import_scep_result.changed
          - import_successful_msg in import_scep_result.msg

    # AC-003: Export ACME CA certificate
    - name: Export ACME CA certificate
      dellemc.openmanage.idrac_certificates:
        command: export
        certificate_type: "ACME_CA_CERT"
        certificate_path: "{{ export_certificate_path }}"
      register: export_acme_result

    - ansible.builtin.set_fact:
        export_successful_msg: "Successfully performed the 'export' certificate operation."

    - name: Verify status of task - export ACME CA certificate
      ansible.builtin.assert:
        that:
          - not export_acme_result.changed
          - export_successful_msg in export_acme_result.msg
          - export_acme_result.certificate_path is defined

    # AC-003: Export SCEP CA certificate
    - name: Export SCEP CA certificate
      dellemc.openmanage.idrac_certificates:
        command: export
        certificate_type: "SCEP_CA_CERT"
        certificate_path: "{{ export_certificate_path }}"
      register: export_scep_result

    - name: Verify status of task - export SCEP CA certificate
      ansible.builtin.assert:
        that:
          - not export_scep_result.changed
          - export_successful_msg in export_scep_result.msg

    # AC-002: Delete ACME CA certificate - Check mode
    - name: Delete ACME CA certificate - Check mode - Changes expected
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "ACME_CA_CERT"
      register: delete_acme_check
      check_mode: true

    - name: Verify status of task - delete ACME CA certificate - check mode
      ansible.builtin.assert:
        that:
          - delete_acme_check.changed
          - delete_acme_check.msg == 'Changes found to be applied.'

    # AC-002: Delete ACME CA certificate - Normal mode
    - name: Delete ACME CA certificate - Normal mode
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "ACME_CA_CERT"
      register: delete_acme_result

    - ansible.builtin.set_fact:
        delete_successful_msg: "Successfully performed the 'delete' certificate operation."

    - name: Verify status of task - delete ACME CA certificate - normal mode
      ansible.builtin.assert:
        that:
          - delete_acme_result.changed
          - delete_successful_msg in delete_acme_result.msg

    # AC-002: Delete ACME CA certificate - Idempotency (already deleted)
    - name: Delete ACME CA certificate - Idempotency
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "ACME_CA_CERT"
      register: delete_acme_idempotent

    - name: Verify status of task - delete ACME CA certificate - idempotency
      ansible.builtin.assert:
        that:
          - not delete_acme_idempotent.changed
          - delete_acme_idempotent.msg == 'No changes found to be applied.'

    # AC-002: Delete SCEP CA certificate - Normal mode
    - name: Delete SCEP CA certificate - Normal mode
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "SCEP_CA_CERT"
      register: delete_scep_result

    - name: Verify status of task - delete SCEP CA certificate - normal mode
      ansible.builtin.assert:
        that:
          - delete_scep_result.changed
          - delete_successful_msg in delete_scep_result.msg

    # AC-005: Import with diff mode
    - name: Import ACME CA certificate with diff mode
      dellemc.openmanage.idrac_certificates:
        command: import
        certificate_type: "ACME_CA_CERT"
        certificate_path: "{{ base_path_for_import_certificate }}{{ acme_ca_certificate_name }}"
        reset: false
      register: import_acme_diff
      diff: true

    - name: Verify status of task - import ACME CA certificate - diff mode
      ansible.builtin.assert:
        that:
          - import_acme_diff.changed
          - import_successful_msg in import_acme_diff.msg

  always:
    # Cleanup - delete any remaining test certificates
    - name: Cleanup - Delete ACME CA certificate
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "ACME_CA_CERT"
      ignore_errors: true

    - name: Cleanup - Delete SCEP CA certificate
      dellemc.openmanage.idrac_certificates:
        command: delete
        certificate_type: "SCEP_CA_CERT"
      ignore_errors: true

    - ansible.builtin.include_tasks: _cleanup.yml

  module_defaults:
    dellemc.openmanage.idrac_certificates:
      idrac_ip: "{{ idrac_ip | ansible.utils.ipwrap }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
      validate_certs: "{{ validate_certs }}"
