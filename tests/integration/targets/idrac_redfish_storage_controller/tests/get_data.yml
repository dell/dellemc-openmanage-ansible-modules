- name: Get data using uri
  uri:
    url: "{{ url }}"
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    method: GET
    body: {}
    validate_certs: false
    body_format: json
    return_content: true
    status_code: 200
    headers: 'Accept=application/json'
  register: fetched_data

- set_fact:
    loop_data: "{{ loop_data | default([]) + [fetched_data] }}"
  when: capture_all is defined
