---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: 'idrac_ip is not defined or idrac_user is not defined or idrac_password
   is not defined'

- name: Block - Self session protection test
  module_defaults:
    dellemc.openmanage.idrac_session:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ idrac_ip }}"
      port: "{{ idrac_port }}"
    dellemc.openmanage.idrac_session_info:
      validate_certs: "{{ validate_certs }}"
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
  block:
    - name: Prerequisite - Create session A for cross-session tests
      dellemc.openmanage.idrac_session:
        validate_certs: "{{ validate_certs }}"
        hostname: "{{ idrac_ip }}"
        port: "{{ idrac_port }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
      register: session_a

    - name: Set session A details
      ansible.builtin.set_fact:
        token_a: "{{ session_a.x_auth_token }}"
        id_a: "{{ session_a.session_data.Id }}"
      when: session_a is not failed

    - name: Prerequisite - Create session B (to delete via session A)
      dellemc.openmanage.idrac_session:
        validate_certs: "{{ validate_certs }}"
        hostname: "{{ idrac_ip }}"
        port: "{{ idrac_port }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
      register: session_b

    - name: Set session B details
      ansible.builtin.set_fact:
        token_b: "{{ session_b.x_auth_token }}"
        id_b: "{{ session_b.session_data.Id }}"
      when: session_b is not failed

    - name: Verify both sessions are visible
      dellemc.openmanage.idrac_session_info:
        validate_certs: "{{ validate_certs }}"
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
      register: both_sessions

    - name: Verify - At least 2 sessions exist
      ansible.builtin.assert:
        that:
          - both_sessions.session_count >= 2

    - name: Delete session B using session A's token (cross-session delete)
      dellemc.openmanage.idrac_session:
        validate_certs: "{{ validate_certs }}"
        hostname: "{{ idrac_ip }}"
        state: absent
        x_auth_token: "{{ token_a }}"
        session_id: "{{ id_b }}"
      register: cross_delete

    - name: Verify - Cross-session delete succeeds
      ansible.builtin.assert:
        that:
          - cross_delete.changed
          - cross_delete.msg == "The session has been deleted successfully."

    - name: Verify session B is gone
      dellemc.openmanage.idrac_session_info:
        validate_certs: "{{ validate_certs }}"
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
      register: after_delete

    - name: Confirm session B no longer in active sessions
      ansible.builtin.assert:
        that:
          - after_delete.sessions | selectattr('id', 'equalto', id_b)
             | list | length == 0

  always:
    - name: Cleanup - Delete session A
      dellemc.openmanage.idrac_session:
        state: absent
        x_auth_token: "{{ token_a }}"
        session_id: "{{ id_a }}"
      failed_when: false
      when: token_a is defined and id_a is defined

    - name: Cleanup - Delete session B (if still exists)
      dellemc.openmanage.idrac_session:
        state: absent
        x_auth_token: "{{ token_b }}"
        session_id: "{{ id_b }}"
      failed_when: false
      when: token_b is defined and id_b is defined
