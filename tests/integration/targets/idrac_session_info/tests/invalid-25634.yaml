---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  ansible.builtin.fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and
     idrac_password.'
  when: 'idrac_ip is not defined or idrac_user is not defined or idrac_password
   is not defined'

- name: Block - Negative test cases
  module_defaults:
    dellemc.openmanage.idrac_session_info:
      validate_certs: "{{ validate_certs }}"
      idrac_ip: "{{ idrac_ip }}"
      idrac_user: "{{ idrac_user }}"
      idrac_password: "{{ idrac_password }}"
  block:
    - name: Negative - Invalid username
      dellemc.openmanage.idrac_session_info:
        idrac_user: invalid_user
      register: invalid_username
      failed_when: false

    - name: Verify - Invalid username fails with auth error
      ansible.builtin.assert:
        that:
          - invalid_username.failed
          - not invalid_username.changed

    - name: Negative - Invalid password
      dellemc.openmanage.idrac_session_info:
        idrac_password: invalid_password
      register: invalid_password
      failed_when: false

    - name: Verify - Invalid password fails
      ansible.builtin.assert:
        that:
          - invalid_password.failed
          - not invalid_password.changed

    - name: Negative - Invalid session_type choice
      dellemc.openmanage.idrac_session_info:
        session_type: InvalidType
      register: invalid_type
      failed_when: false

    - name: Verify - Invalid session_type fails
      ansible.builtin.assert:
        that:
          - invalid_type.failed
          - not invalid_type.changed

    - name: Negative - Zero stale_threshold_minutes
      dellemc.openmanage.idrac_session_info:
        stale_threshold_minutes: 0
      register: zero_threshold
      failed_when: false

    - name: Verify - Zero stale_threshold_minutes fails
      ansible.builtin.assert:
        that:
          - zero_threshold.failed
          - not zero_threshold.changed
          - zero_threshold.msg ==
            "stale_threshold_minutes must be a positive integer."

    - name: Negative - Negative stale_threshold_minutes
      dellemc.openmanage.idrac_session_info:
        stale_threshold_minutes: -5
      register: negative_threshold
      failed_when: false

    - name: Verify - Negative stale_threshold_minutes fails
      ansible.builtin.assert:
        that:
          - negative_threshold.failed
          - not negative_threshold.changed
          - negative_threshold.msg ==
            "stale_threshold_minutes must be a positive integer."

    - name: Negative - Unreachable host
      dellemc.openmanage.idrac_session_info:
        idrac_ip: 999.999.999.999
      register: unreachable_host
      ignore_unreachable: true
      failed_when: false

    - name: Verify - Unreachable host
      ansible.builtin.assert:
        that:
          - >-
            unreachable_host.unreachable is defined
            and unreachable_host.unreachable
            or unreachable_host.failed is defined
            and unreachable_host.failed
          - not unreachable_host.changed

    - name: Negative - Unsupported argument
      dellemc.openmanage.idrac_session_info:
        unsupported_argument: unsupported
      register: unsupported_arg
      failed_when: false

    - name: Verify - Unsupported argument fails
      ansible.builtin.assert:
        that:
          - unsupported_arg.failed
          - not unsupported_arg.changed
