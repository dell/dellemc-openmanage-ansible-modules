---
- block:
    - name: Fetch OMEM device information.
      dellemc.openmanage.ome_device_info:
      register: result

    - name: Get switch details.
      ansible.builtin.set_fact:
        device_info: "{{ result.device_info.value | json_query(query) }}"
      vars:
        query: "[?Model == '{{ switch_model_1 }}' || Model == '{{ switch_model_2 }}']"

    - name: Prerequisite - Delete the existing smart fabric
      dellemc.openmanage.ome_smart_fabric:
        state: absent
        name: "omam_test_fabric"
      register: delete

    - name: Prerequisite - wait for 30 minutes for fabric to be deleted.
      ansible.builtin.wait_for:
        timeout: 1800
      when: delete.changed

    - name: Prerequisite - Create a smart fabric
      dellemc.openmanage.ome_smart_fabric:
        name: "omam_test_fabric"
        description: "omam_test_fabric description"
        fabric_design: "{{fabric_design}}"
        primary_switch_service_tag: "{{device_info[0].DeviceServiceTag}}"
        secondary_switch_service_tag: "{{device_info[1].DeviceServiceTag}}"
        override_LLDP_configuration: "Enabled"
      register: result

    - name: Prerequisite - Wait for fabric to be created.
      ansible.builtin.uri:
        url: "https://{{hostname}}/api/NetworkService\
          /Fabrics('{{result.fabric_id}}')"
        user: "{{username}}"
        password: "{{password}}"
        validate_certs: false
      when: result.changed
      register: fabric_status
      until: "{{ fabric_status.json.LifeCycleStatus[0].Status == '2060' }}"
      retries: 10
      delay: 600


    - name: Prerequisite - Verify the status of fabric creation task
      ansible.builtin.assert:
        that:
          - result.changed and result.msg == "Fabric creation operation is initiated."


  module_defaults:
    dellemc.openmanage.ome_smart_fabric:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"

    dellemc.openmanage.ome_device_info:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
