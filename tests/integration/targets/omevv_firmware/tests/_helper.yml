---
- name: Get Vcenter details by uri.
  ansible.builtin.uri:
    url: https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/omevv/GatewayService/v1/Consoles
    user: "{{ ome_username }}"
    password: "{{ ome_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: 200
  register: uri_resp

- name: Convert response json list to dict
  set_fact:
    uuid: "{{ uri_resp.json[0].uuid }}"

- name: Get group details
  ansible.builtin.uri:
    url: https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/omevv/GatewayService/v1/Consoles/{{ uuid }}/Groups
    user: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: 200
    headers:
      x_omivv-api-vcenter-identifier: "{{ uuid }}"
  register: group_details

- name: Find the CLUSTER group
  ansible.builtin.set_fact:
    cluster_name: "{{ item.consoleEntityName }}"
    group_id: "{{ item.groupId }}"
  loop: "{{ group_details.json }}"
  when: item.groupType == "CLUSTER"
  register: cluster_result
  until: cluster_result is defined
  retries: 1
  delay: 0

- name: Find hosts details
  ansible.builtin.uri:
    url: https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/omevv/GatewayService/v1/Consoles/{{ uuid }}/ManagedHosts
    user: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: 200
    headers:
      x_omivv-api-vcenter-identifier: "{{ uuid }}"
  register: host_details

- name: Check if there is managed hosts
  ansible.builtin.fail:
    msg: "No managed hosts found in the cluster"
  when: host_details.json == []

- name: Filter hosts belonging to the group
  ansible.builtin.set_fact:
    filtered_hosts: "{{ host_details.json | selectattr('omevvpGroupId', 'equalto', group_id | int) | list }}"

- name: Set host and service tag lists
  ansible.builtin.set_fact:
    host_ip_list: "{{ filtered_hosts | map(attribute='hostName') | list }}"
    servicetag_list: "{{ filtered_hosts | map(attribute='serviceTag') | list }}"
    idrac_ip_list: "{{ filtered_hosts | map(attribute='idracIP') | list }}"
    host_id_list: "{{ filtered_hosts | map(attribute='id') | list }}"
  when: filtered_hosts is defined

- name: Upgrade firmware local executable file
  dellemc.openmanage.redfish_firmware:
    baseuri: "{{ item }}"
    username: "{{ omevv_idrac_username }}"
    password: "{{ omevv_idrac_password }}"
    validate_certs: false
    timeout: 1200
    image_uri: "{{ omevv_firmware_idrac_upgrade_http_path }}"
    transfer_protocol: HTTP
  loop: "{{ idrac_ip_list }}"
  when:
  - omevv_firmware_idrac_upgrade_http_path is defined and omevv_firmware_idrac_upgrade_http_path != ''
  - upgrade is defined and upgrade is true

- name: Downgrade firmware local executable file
  dellemc.openmanage.redfish_firmware:
    baseuri: "{{ item }}"
    username: "{{ omevv_idrac_username }}"
    password: "{{ omevv_idrac_password }}"
    validate_certs: false
    timeout: 1200
    image_uri: "{{ omevv_firmware_idrac_downgrade_http_path }}"
    transfer_protocol: HTTP
  loop: "{{ idrac_ip_list }}"
  when:
  - omevv_firmware_idrac_downgrade_http_path is defined and omevv_firmware_idrac_downgrade_http_path != ''
  - downgrade is defined and downgrade is true

- name: Gather_fact
  ansible.builtin.gather_facts:
  register: facts

- name: Running Inventory with compliance
  ansible.builtin.uri:
    url: https://{{ hostname | ansible.utils.ipwrap }}:{{ port }}/omevv/GatewayService/v1/Consoles/{{ uuid }}/Hosts/RunComplianceWithInventory
    user: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    force_basic_auth: true
    method: "POST"
    body: "{{ payload }}"
    body_format: json
    status_code: 202
    headers:
      x_omivv-api-vcenter-identifier: "{{ uuid }}"
  register: inventoryId
  vars:
    payload:
      jobName: "RunInventory-{{ facts.ansible_facts.ansible_date_time.epoch }}"
      hostIds: "{{ host_id_list }}"
      jobDescription: "Run inventory"
