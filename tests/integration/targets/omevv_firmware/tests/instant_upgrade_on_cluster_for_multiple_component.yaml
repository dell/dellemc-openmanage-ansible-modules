---
- name: Test that we have an OME host, OME username and OME password
  ansible.builtin.fail:
    msg: "Please define the following variables: hostname, vcenter_username
      and vcenter_password."
  when: hostname is not defined or vcenter_username is not defined or
    vcenter_password is not defined

- block:
    - name: Fetch pre-requisite details
      ansible.builtin.include_tasks: ../_helper.yml
      vars:
        upgrade: true

    - name: Including helper file for creating firmware repo profile
      ansible.builtin.include_tasks: ../_pre_req_create.yml

    - name: Checking if firmware components is there for upgrade
      ansible.builtin.fail:
        msg: "There is no multiple firmware component available for upgrade."
      when: up_firm_list | length > 1

    - name: Adding 24 hours from current time
      ansible.builtin.set_fact:
        scheduled_time: "{{ time_format | strftime((epoch | int ) + 24*60*60)}}"
      vars:
        time_format: "%Y-%m-%dT%H:%M:%S%z"
        epoch: "{{ facts.ansible_facts.ansible_date_time.epoch }}"

    - name: Instant upgrade on cluster for multiple component
        (Check mode and Diff mode)
      dellemc.openmanage.omevv.omevv_firmware: &upgrade_firmware
        run_now: false
        date_time: "{{ scheduled_time }}"
        enter_maintenance_mode_timeout: 60
        enter_maintenance_mode_options: FULL_DATA_MIGRATION
        drs_check: true
        evacuate_VMs: true
        exit_maintenance_mode: true
        maintenance_mode_count_check: true
        check_vSAN_health: true
        delete_job_queue: true
        reset_idrac: true
        reboot_options: FORCEREBOOT
        targets:
          - cluster: "{{ cluster_name }}"
            firmware_components:
              - "{{ up_firm_list[0] }}"
              - "{{ up_firm_list[1] }}"
      register: cm_changes
      check_mode: true
      diff: true

    - name: Verify task status - Instant upgrade on cluster for multiple
        component (Check mode)
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - cm_changes.msg == "Changes found to be applied."
          - cm_changes.diff.before[up_firm_list[0]].firmwareversion <
            cm_changes.diff.after[up_firm_list[0]].firmwareversion

    - name: Instant upgrade on cluster for multiple component.
        (Normal and Diff Mode)
      dellemc.openmanage.omevv.omevv_firmware:
        <<: *upgrade_firmware
      diff: true
      register: upgrade_result

    - name: Verify task status - Instant upgrade on cluster for multiple
        component. (Normal and Diff Mode)
      ansible.builtin.assert:
        that:
          - upgrade_result.changed
          - upgrade_result.msg ==
            "Successfully completed the firmware update."
          - upgrade_result.diff.before[up_firm_list[0]].firmwareversion <
            upgrade_result.diff.after[up_firm_list[0]].firmwareversion

    - name: Instant upgrade on cluster for multiple component.
        (Idempotency and Diff Mode)
      dellemc.openmanage.omevv.omevv_firmware:
        <<: *upgrade_firmware
      diff: true
      register: upgrade_result_idemp

    - name: Verify task status - Instant upgrade on cluster for multiple
        component. (Idempotency and diff Mode)
      ansible.builtin.assert:
        that:
          - not upgrade_result_idemp.changed
          - upgrade_result_idemp.msg == idemp_msg
          # - upgrade_result_idemp.diff.after == {}
          # - upgrade_result_idemp.diff.before == {}
      vars:
        idemp_msg: "No changes found to be applied."
  always:
    - name: Canceling scheduled job.
      ansible.builtin.include_tasks: ../_cancel_firm_update_job.yml
      vars:
        job_id: "{{ upgrade_result.job_details.jobId }}"
      when: upgrade_result is defined

    - name: Deleting baseline profile
      dellemc.openmanage.omevv_baseline_profile:
        hostname: "{{ hostname }}"
        vcenter_uuid: "{{ uuid}}"
        vcenter_username: "{{ vcenter_username }}"
        vcenter_password: "{{ vcenter_password }}"
        validate_certs: false
        name: "AnsibleTest"
        state: absent
      ignore_errors: true
      no_log: false

  module_defaults:
    dellemc.openmanage.omevv.omevv_firmware:
      hostname: "{{ hostname }}"
      vcenter_username: "{{ vcenter_username }}"
      vcenter_password: "{{ vcenter_password }}"
      vcenter_uuid: "{{ uuid }}"
      port: "{{ port }}"
      validate_certs: "{{ validate_certs }}"
