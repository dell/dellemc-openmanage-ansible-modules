---
- name: Adding 2 min from current time
  ansible.builtin.set_fact:
    baseline_time: "{{ time_format | strftime((epoch | int ) + 120)}}"
  vars:
    time_format: "%H:%M"
    epoch: "{{ facts.ansible_facts.ansible_date_time.epoch }}"

- name: Pre-requisite - Create a baseline profile
  dellemc.openmanage.omevv_baseline_profile:
    hostname: "{{ hostname }}"
    vcenter_uuid: "{{ uuid }}"
    vcenter_username: "{{ vcenter_username }}"
    vcenter_password: "{{ vcenter_password }}"
    name: "AnsibleTest"
    repository_profile: "Dell Default Catalog"
    validate_certs: false
    description: "Firmware repository profile created by Module"
    cluster:
      - "{{ cluster_name }}"
    days:
      - "all"
    time: "{{ baseline_time }}"
  register: create_result

- name: Fetch the firmware drift
  dellemc.openmanage.omevv_firmware_compliance_info:
    hostname: "{{ hostname }}"
    vcenter_username: "{{ vcenter_username }}"
    vcenter_password: "{{ vcenter_password }}"
    vcenter_uuid: "{{ uuid }}"
    validate_certs: false
  register: drift_info

- name: Extracting upgrade firmware drift
  ansible.builtin.set_fact:
    up_firm_list: >-
          {%- set up_firm_list = [] -%}
          {%- for each_cluster in drift_info.firmware_compliance_info -%}
          {%- if each_cluster.cluster == cluster_name -%}
          {%- for eachhostcompliance in each_cluster.hostComplianceReports -%}
          {%- for eachcompliance in eachhostcompliance.componentCompliances -%}
          {%- if eachcompliance.updateAction == 'UPGRADE' -%}
          {{ up_firm_list.append(eachcompliance.sourceName) }}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {{ up_firm_list | unique }}

- name: Extracting downgrade firmware drift
  ansible.builtin.set_fact:
    down_firm_list: >-
          {%- set down_firm_list = [] -%}
          {%- for each_cluster in drift_info.firmware_compliance_info -%}
          {%- if each_cluster.cluster == cluster_name -%}
          {%- for eachhostcompliance in each_cluster.hostComplianceReports -%}
          {%- for eachcompliance in eachhostcompliance.componentCompliances -%}
          {%- if eachcompliance.updateAction == 'DOWNGRADE' -%}
          {{ down_firm_list.append(eachcompliance.sourceName) }}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {{ down_firm_list | unique }}
