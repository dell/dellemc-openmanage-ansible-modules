---
- name: Test that we have an OME host, OME username and OME password
  ansible.builtin.fail:
    msg: "Please define the following variables: hostname, vcenter_username
      and vcenter_password."
  when: hostname is not defined or vcenter_username is not defined or
    vcenter_password is not defined

- block:
    - name: Fetch pre-requisite details
      ansible.builtin.include_tasks: ../_helper.yml
      vars:
        downgrade: true

    - name: Including helper file for creating firmware repo profile
      ansible.builtin.include_tasks: ../_pre_req_create.yml
    
    - name: Checking if firmware components is there for downgrade
      ansible.builtin.fail:
        msg: "There is no multiple firmware component available for downgrade."
      when: down_non_reboot_firm_list is undefined

    - name: Instant downgrade on cluster for multiple non reboot component
        (Check mode and Diff mode)
      dellemc.openmanage.omevv.omevv_firmware: &downgrade_firmware
        run_now: true
        enter_maintenance_mode_timeout: 60
        enter_maintenance_mode_options: NO_DATA_MIGRATION
        drs_check: false
        evacuate_VMs: false
        exit_maintenance_mode: false
        maintenance_mode_count_check: false
        check_vSAN_health: false
        delete_job_queue: false
        reset_idrac: true
        reboot_options: FORCEREBOOT
        targets:
          - host: "{{ host }}"
            firmware_components: "{{ down_non_reboot_firm_list }}"
      register: cm_changes
      check_mode: true
      diff: true

    - name: Verify task status - Instant downgrade on cluster for multiple
        non reboot component (Check mode)
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - cm_changes.msg == "Changes found to be applied."
          - cm_changes.diff.before[up_reboot_firm_list[0]].firmwareversion >
            cm_changes.diff.after[up_reboot_firm_list[0]].firmwareversion

    - name: Instant downgrade on cluster for multiple non reboot component.
        (Normal and Diff Mode)
      dellemc.openmanage.omevv.omevv_firmware:
        <<: *downgrade_firmware
      diff: true
      register: down_result

    - name: Verify task status - Instant downgrade on cluster for multiple
        non reboot component. (Normal Mode)
      ansible.builtin.assert:
        that:
          - down_result.changed
          - down_result.msg ==
            "Successfully Instantd the firmware update job."
          - down_result.diff.before[up_reboot_firm_list[0]].firmwareversion >
            down_result.diff.after[up_reboot_firm_list[0]].firmwareversion

    - name: Instant downgrade on cluster for multiple non reboot component.
        (Idempotency and Diff Mode)
      dellemc.openmanage.omevv.omevv_firmware:
        <<: *downgrade_firmware
      diff: true
      register: downgrade_result_idemp

    - name: Verify task status - Instant downgrade on cluster for multiple
        non reboot component. (Idempotency and diff Mode)
      ansible.builtin.assert:
        that:
          - not downgrade_result_idemp.changed
          - downgrade_result_idemp.skipped
          - downgrade_result_idemp.msg == idemp_msg
          # - downgrade_result_idemp.diff.after == {}
          # - downgrade_result_idemp.diff.before == {}
      vars:
        idemp_msg: "Update Job already running for
          group id {{ group_id }} corresponding to cluster {{ cluster_name }}.
          Wait for its completion and trigger."
  always:
    - name: Canceling Instantd job.
      ansible.builtin.include_tasks: ../_cancel_firm_update_job.yml
      vars:
        job_id: "{{ down_result.job_details.jobId }}"
      when: down_result is defined

    - name: Deleting baseling profile
      dellemc.openmanage.omevv_baseline_profile:
        hostname: "{{ hostname }}"
        vcenter_uuid: "{{ uuid}}"
        vcenter_username: "{{ vcenter_username }}"
        vcenter_password: "{{ vcenter_password }}"
        validate_certs: false
        name: "AnsibleTest"
        state: absent
      ignore_errors: true
      no_log: false

  module_defaults:
    dellemc.openmanage.omevv.omevv_firmware:
      hostname: "{{ hostname }}"
      vcenter_username: "{{ vcenter_username }}"
      vcenter_password: "{{ vcenter_password }}"
      vcenter_uuid: "{{ uuid }}"
      port: "{{ port }}"
      validate_certs: "{{ validate_certs }}"
