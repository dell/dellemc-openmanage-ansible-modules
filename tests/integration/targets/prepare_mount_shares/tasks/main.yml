---
- name: Collect only facts returned by facter
  ansible.builtin.setup:
    gather_subset:
      - facter
  run_once: true

- name: Setting home path and current user
  ansible.builtin.set_fact:
    home_path: "/tmp"
    current_user: "{{ ansible_user_id }}"
  run_once: true

- name: Prepare NFS and CIFS shares
  run_once: true
  block:
    - name: Install NFS mount utility
      become: true
      ansible.builtin.dnf:
        name: nfs-utils
        state: present
        update_cache: true
      when: ansible_os_family == "RedHat"

    - name: Ensure NFS utilities are installed.
      become: true
      ansible.builtin.apt:
        name:
          - nfs-common
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Create NFS mount directory
      become: true
      ansible.builtin.file:
        path: "{{ home_path }}/nfs"
        state: directory
        mode: '0755'

    - name: Mount NFS share
      become: true
      ansible.posix.mount:
        src: "{{ nfs_share_name }}"
        path: "{{ home_path }}/nfs"
        fstype: nfs
        state: mounted
      register: nfs_mount_result
      failed_when: false

    - name: Set NFS mount fact
      ansible.builtin.set_fact:
        nfs_mount:
          name: "{{ home_path }}/nfs"

    - name: Create CIFS mount directory
      become: true
      ansible.builtin.file:
        path: "{{ home_path }}/cifs"
        state: directory
        mode: '0755'

    - name: Mount CIFS share
      become: true
      ansible.posix.mount:
        src: "{{ cifs_share_name }}"
        path: "{{ home_path }}/cifs"
        fstype: cifs
        opts: >-
          username={{ cifs_share_user }},password={{ cifs_share_password }},
          file_mode=0777,dir_mode=0777
        state: mounted
      register: cifs_mount_result
      failed_when: false

    - name: Set CIFS mount fact
      ansible.builtin.set_fact:
        cifs_mount:
          name: "{{ home_path }}/cifs"

    - name: Setting share mount
      ansible.builtin.set_fact:
        nfs_share_mnt: "{{ nfs_mount.name }}"
        cifs_share_mnt: "{{ cifs_mount.name }}"
