---
- block:
    - name: Get the device service tag of a server
        present under idrac group in inventory.
      dellemc.openmanage.ome_device_info:
        hostname: "{{hostname}}"
      register: all_devices

    - ansible.builtin.set_fact:
        device_info: "{{ all_devices | json_query(query) }}"
      vars:
        query: 'device_info.value[?DeviceManagement[?NetworkAddress==
          `{{ hostname }}`]]'

    - ansible.builtin.set_fact:
        device_info: "{{all_devices | json_query(query)}}"
      vars:
        query:
          'device_info.value[?DeviceManagement[?NetworkAddress ==
           `{{ hostname }}`]]'

    - name: Get device service tag and device id of the host
      ansible.builtin.set_fact:
        device_service_tag: "{{device_info[0].DeviceServiceTag}}"
        device_id: "{{device_info[0].Id}}"

  module_defaults:
    dellemc.openmanage.ome_device_info:
      validate_certs: "{{validate_certs}}"
      hostname: "{{hostname}}"
      username: "{{username}}"
      password: "{{password}}"
      port: "{{port}}"
