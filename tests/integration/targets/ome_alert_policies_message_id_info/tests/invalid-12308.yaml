---
- name: Test that we have an OME host, OME username and OME password
  fail:
    msg: 'Please define the following variables: hostname, username and password.'
  when: hostname is not defined or username is not defined or password is not defined

- block:
    - name: Get message id info (Negative - invalid hostname).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        hostname: invalidHostname
      ignore_unreachable: true
      register: invalid_hostname_output

    - name: Get message id info (Negative - invalid port).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        port: 999
      ignore_unreachable: true
      register: invalid_port_output

    - name: Get message id info (Negative - invalid username).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        username: invalidUsername
      ignore_errors: true
      register: invalid_username_output

    - name: Get message id info (Negative - invalid password).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        password: invalidPassword
      ignore_errors: true
      register: invalid_password_output

    - name: Get message id info (Negative - invalid ca_path).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        ca_path: invalidPath
      ignore_errors: true
      register: invalid_ca_path_output

    - name: Get message id info (Negative - unsupported parameter).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        policy_id: invalidID
      ignore_errors: true
      register: invalid_parameter_output

    - name: Get message id info (Negative - invalid validate_certs).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        validate_certs: "Falsee"
      ignore_errors: true
      register: invalid_certs_output

    - name: Get message id info (Negative - invalid timeout).
      dellemc.openmanage.ome_alert_policies_message_id_info:
        timeout: -5
      ignore_errors: true
      register: invalid_timeout_output

    - name: Verify the status of tasks
      ansible.builtin.assert:
        that:
          - invalid_hostname_output.unreachable
          - not invalid_hostname_output.changed
          - "'<urlopen error [Errno -2] Name or service not known>' == invalid_hostname_output.msg or '<urlopen error Unable to resolve hostname or IP invalidHostname.>' == invalid_hostname_output.msg"
          - invalid_port_output.unreachable
          - not invalid_port_output.changed
          - "'<urlopen error [Errno 113] No route to host>' == invalid_port_output.msg or '<urlopen error [Errno 13] Permission denied>' == invalid_port_output.msg"
          - invalid_username_output.failed
          - not invalid_username_output.changed
          - "'HTTP Error 401: 401' == invalid_username_output.msg or 'HTTP Error 400: 400' == invalid_username_output.msg"
          - invalid_password_output.failed
          - not invalid_password_output.changed
          - "'HTTP Error 401: 401' == invalid_password_output.msg or 'HTTP Error 400: 400' == invalid_password_output.msg"
          - invalid_ca_path_output.failed
          - not invalid_ca_path_output.changed
          - "'[Errno 2] No such file or directory' == invalid_ca_path_output.msg"
          - invalid_parameter_output.failed
          - not invalid_parameter_output.changed
          - 'invalid_parameter_output.msg == "Unsupported parameters for (dellemc.openmanage.ome_alert_policies_message_id_info) module: policy_id. Supported parameters include: ca_path, hostname, password, port, timeout, username, validate_certs, x_auth_token."'
          - invalid_certs_output.failed
          - not invalid_certs_output.changed
          - >
            (
              "'argument \\'validate_certs\\' is of type str and we were unable to convert to bool: The value \\'Falsee\\' is not a valid boolean. Valid booleans include:' in invalid_certs_output.msg
            )
            or
            (
              "'argument \\'validate_certs\\' is of type str and could not be converted to bool' in invalid_certs_output.msg
            )
          - invalid_timeout_output.failed
          - not invalid_timeout_output.changed
          - "'Timeout value out of range' == invalid_timeout_output.msg"
          

  module_defaults:
    dellemc.openmanage.ome_alert_policies_message_id_info:
      validate_certs: "{{validate_certs}}"
      hostname: "{{hostname}}"
      username: "{{username}}"
      password: "{{password}}"
      port: "{{port}}"
