---
- name: Test that we have an OME host, OME username and OME password
  ansible.builtin.fail:
    msg: 'Please define the following variables: hostname, username
      and password.'
  when: hostname is not defined or username is not defined or password
    is not defined

- name: Create CA Trust
  ansible.builtin.include_tasks: _ca_helper.yml

- name: Scenerio to upload the certificate with mulitple param combinations
    values
  vars:
    commonName: "ome.welcome.com"
    countryName: "US"
    emailAddress: "support@dell.com"
    localityName:
      - "Round Rock"
      - "Mahadevpura"
    organizationName:
      - "Dell Inc."
      - "ISG"
    organizationalUnitName:
      - "Remote Access Group"
      - "EcoSystem"
    stateOrProvinceName:
      - "Texas"
      - "Bangalore"
    sub_alt_name_list:
      - hostname1.chassis.com
      - hostname2.chassis.com
      - hostname3.chassis.com

  block:
    - name: Generate a certificate signing request.
      dellemc.openmanage.ome_application_certificate:
        distinguished_name: "{{ commonName }}"
        department_name: "{{ organizationalUnitName | join(',') }}"
        business_name: "{{ organizationName | join(',') }}"
        locality: "{{ localityName | join(',') }}"
        country_state: "{{ stateOrProvinceName | join(',') }}"
        country: "{{ countryName }}"
        email: "{{ emailAddress }}"
        subject_alternative_names: "{{ sub_alt_name_list | join(',') }}"
      register: ome_csr

    - name: Verify the status of tasks
      ansible.builtin.assert:
        that:
          - not ome_csr.changed
          - ome_csr.csr_status.CertificateData.startswith
            ("-----BEGIN CERTIFICATE REQUEST-----\n")
          - ome_csr.csr_status.CertificateData.endswith
            ("\n-----END CERTIFICATE REQUEST-----")

    - name: Copy CSR data into a file.
      ansible.builtin.copy:
        content: "{{ ome_csr.csr_status.CertificateData }}"
        dest: "{{ csr_path }}"
        mode: "0600"

    - name: Create OpenSSL config file with EKU
      ansible.builtin.copy:
        dest: "{{ openssl_config_path }}"
        mode: "0644"
        content: |
          [ v3_req ]
          keyUsage = critical, digitalSignature, keyEncipherment
          extendedKeyUsage = serverAuth, clientAuth
          subjectAltName = @alt_names

          [ alt_names ]
          {% for name in sub_alt_name_list %}
          DNS.{{ loop.index }} = {{ name }}
          {% endfor %}

    - name: Certificate signing
      ansible.builtin.include_tasks: _sign_certificate.yml

    - name: Upload the certificate
      dellemc.openmanage.ome_application_certificate:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        command: "upload"
        upload_file: "{{ signed_cert_path }}"
      register: upload_result

    - name: Verify upload of the certificate
      ansible.builtin.assert:
        that:
          - upload_result.changed
          - "upload_result.msg == 'Successfully
            uploaded application certificate.'"

    - name: wait for 1 minute for OME setup to up
      ansible.builtin.pause:
        seconds: 60

  always:
    - name: Cleanup of all generated files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ca_key_path }}"
        - "{{ ca_cert_path }}"
        - "{{ ca_srl_path }}"
        - "{{ csr_path }}"
        - "{{ signed_cert_path }}"
      when: cleanup | default(true)

  module_defaults:
    dellemc.openmanage.ome_application_certificate:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
