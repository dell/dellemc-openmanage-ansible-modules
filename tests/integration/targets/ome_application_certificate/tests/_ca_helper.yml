---
- name: Create a local Certificate Authority
  # vars:
  #   ca_key_path: "./ca_private_key.pem"
  #   ca_cert_path: "./ca_cert.pem"
  #   ca_srl_path: "./ca_cert.srl"
  #   ca_subject: "/C=US/ST=California/L=The Cloud/O=Dell/OU=ISG/CN=ca_trust_usr"
  #   ca_days_valid: 365
  #   csr_path: "./csr_data.pem"
  #   signed_cert_path: "./signed_certificate.cer"

  block:
    - name: Generate CA private key and self-signed certificate
      ansible.builtin.command: >
        openssl req -x509 -days {{ ca_days_valid }}
        -newkey rsa:4096
        -keyout {{ ca_key_path }}
        -out {{ ca_cert_path }}
        -nodes
        -subj "{{ ca_subject }}"
      args:
        creates: "{{ ca_cert_path }}"

    - name: Create CA serial file with serial number
      ansible.builtin.copy:
        dest: "{{ ca_srl_path }}"
        content: "1000\n"
        mode: '0644'
      when: not lookup('file', ca_srl_path, errors='ignore')

