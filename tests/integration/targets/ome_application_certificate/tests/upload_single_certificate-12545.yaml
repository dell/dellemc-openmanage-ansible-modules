---
- name: Test that we have an OME host, OME username and OME password
  ansible.builtin.fail:
    msg: 'Please define the following variables: hostname, username
         and password.'
  when: hostname is not defined or username is not defined or password
         is not defined

- name: Ensure directory exists
  ansible.builtin.file:
    path: "{{ ome_application_certificate_local_temp_path }}"
    state: directory

- name: Download certificate to upload
  ansible.builtin.include_tasks: _download_single_parms_certificate.yaml

- block:
    - name: Upload the certificate
      dellemc.openmanage.ome_application_certificate:
        hostname: "{{ hostname }}"
        username: "{{ username }}"
        password: "{{ password }}"
        validate_certs: "{{ validate_certs }}"
        command: "upload"
        upload_file: "{{ ome_application_certificate_local_temp_path
          }}/{{ ome_application_certificate_certificate_single_cert_filename }}"
      register: upload_result

    - name: Verify upload of the certificate
      ansible.builtin.assert:
        that:
          - upload_result.changed
          - "upload_result.msg == 'Successfully
            uploaded application certificate.'"

  always:
    - name: Delete created directory
      ansible.builtin.file:
        path: "{{ ome_application_certificate_local_temp_path }}"
        state: absent

  module_defaults:
    dellemc.openmanage.ome_application_certificate:
      validate_certs: "{{ validate_certs }}"
      hostname: "{{ hostname }}"
      username: "{{ username }}"
      password: "{{ password }}"
      port: "{{ port }}"
