---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or idrac_password is not defined

- name: Check if module is calling omsdk
  ansible.builtin.include_tasks: _check_firmware_version_supported.yml

- block:
    - name: Get System Inventory
      idrac_system_info:
      register: result

    - name: Get Fan details - no omsdk required
      ansible.builtin.include_tasks: _validate_fan.yml

    - name: assert
      ansible.builtin.assert:
        that:
          - result.system_info.Fan| to_json | symmetric_difference(fan_updated_dict| to_json)

    - name: Get Bios details - no omsdk required
      ansible.builtin.include_tasks: _validate_bios.yml

    - name: assert
      ansible.builtin.assert:
        that:
          - result.system_info.BIOS| to_json | symmetric_difference(bios_updated_dict| to_json)

    - name: Get CPU details - no omsdk required
      ansible.builtin.include_tasks: _validate_cpu.yml

    - name: assert
      ansible.builtin.assert:
        that:
          - result.system_info.CPU| to_json | symmetric_difference(cpu_updated_dict| to_json)

    - name: Get Enclosure details - no omsdk required
      ansible.builtin.include_tasks: _validate_enclosure_details.yml

    - name: Assert enclosure info is correct
      ansible.builtin.assert:
        that:
          - result.system_info.Enclosure| to_json | symmetric_difference(enclosure_updated_dict| to_json)

    - name: Assert enclosure sensor info is correct
      ansible.builtin.assert:
        that:
          - result.system_info.EnclosureSensor| to_json | symmetric_difference(enclosure_updated_dict | to_json)
  when:
    - not is_omsdk_required | bool

  module_defaults:
    dellemc.openmanage.idrac_system_info:
      idrac_ip: "{{idrac_ip}}"
      idrac_user: "{{idrac_user}}"
      idrac_password: "{{idrac_password}}"
      validate_certs: "{{validate_certs}}"
