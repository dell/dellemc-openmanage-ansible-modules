---
- name: Test that we have an iDRAC host, iDRAC username and iDRAC password
  fail:
    msg: 'Please define the following variables: idrac_ip, idrac_user and idrac_password.'
  when: idrac_ip is not defined or idrac_user is not defined or idrac_password is not defined

- name: Check if module is calling omsdk
  ansible.builtin.include_tasks: _check_firmware_version_supported.yml

- block:
    - name: Get System Inventory
      idrac_system_info:
      register: result

    - name: Set baseuri
      ansible.builtin.set_fact:
        baseuri: "https://{{idrac_ip}}:{{idrac_port}}/redfish/v1/"

    - name: Get Fan details - no omsdk required
      ansible.builtin.include_tasks: _validate_fan.yml
  when:
    - not is_omsdk_required | bool

  module_defaults:
    dellemc.openmanage.idrac_system_info:
      idrac_ip: "{{idrac_ip}}"
      idrac_user: "{{idrac_user}}"
      idrac_password: "{{idrac_password}}"
      validate_certs: "{{validate_certs}}"
