---
- name: Fetch enclosure details
  ansible.builtin.uri:
    url: "{{ chassis_uri }}"
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    method: GET
    force_basic_auth: true
    validate_certs: false
    body_format: json
    return_content: true
    status_code: 200
  register: uri_data

- name: Structure enclosure and enclosure sensor details
  ansible.builtin.command:
    cmd: >
      python _get_enclosure_details.py '{{ uri_data.content | to_json }}'
    chdir: "{{ playbook_dir }}/targets/idrac_system_info/tests"
  register: enclosure_updated_dict
  no_log: true
  when:
    - uri_data.status == 200

- name: enclosure debug
  debug:
    var: enclosure_updated_dict