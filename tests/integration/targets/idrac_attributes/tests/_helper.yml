- block:
    - set_fact:
        list_attr: []
        scp_val_attr: []

    - name: Create Export SCP job.
      uri:
        url: https://{{idrac_ip}}:{{idrac_port}}/redfish/v1/Managers/iDRAC.Embedded.1/Actions/Oem/EID_674_Manager.ExportSystemConfiguration
        user: "{{idrac_user}}"
        password: "{{idrac_password}}"
        method: POST
        body:
          ExportFormat: JSON
          ShareParameters:
            Target: [ALL]
        validate_certs: false
        body_format: json
        return_content: true
        status_code: 202
        headers: 'Accept=application/json'
      register: all_uri

    - name: Get Exported SCP contents.
      uri:
        url: "{{all_uri.location}}"
        user: "{{idrac_user}}"
        password: "{{idrac_password}}"
        return_content: true
        validate_certs: false
        headers:
          Accept: application/json
      register: uri_scp_content
      until: not uri_scp_content.failed
      retries: 5
      delay: 15

    - copy: content={{uri_scp_content.content | string}} dest=uri_scp_export_{{idrac_ip}}.json
      register: uri_file

    - name: "Read SCP file and store in variable"
      set_fact:
        scp: "{{ lookup('file', './uri_scp_export_{{idrac_ip}}.json') }}"

    - name: Fetch components key from SCP
      set_fact:
        all_settings: "{{ scp.SystemConfiguration.Components }}"

    - name: Extract iDRAC.Embedded.1
      set_fact:
        idrac_settings: "{{ all_settings | selectattr('FQDD','in',fqdd) | list | flatten}}"

    - name: Extract all iDRAC attributes
      set_fact:
        idrac_settings_attr: "{{ idrac_settings | map(attribute='Attributes') | list | flatten}}"

    - name: Fetch keys of input
      set_fact:
        input_list: "{{ attrs.keys() }}"

    - name: Replace last occurrence of . with #
      set_fact:
        list_attr: "{{ list_attr + [item | regex_replace('^(.*)\\.', '\\1#')] }}"
      with_items:
        - "{{input_list}}"

    - name: Fetch idrac settings
      set_fact:
        scp_attr: "{{ idrac_settings_attr | selectattr('Name','in',list_attr) }}"

    - name: Fetch values
      set_fact:
        scp_val_attr: "{{ scp_val_attr + [item.Value] }}"
      with_items:
        - "{{scp_attr}}"
