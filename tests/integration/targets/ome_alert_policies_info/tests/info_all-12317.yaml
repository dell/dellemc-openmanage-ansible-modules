---
- name: Test that we have an OME host, OME username and OME password
  ansible.builtin.fail:
    msg: 'Please define the following variables: hostname,
      username and password.'
  when: hostname is not defined or username is not
    defined or password is not defined

- block:

    - name: Get all alert policy info details.
      dellemc.openmanage.ome_alert_policies_info: {}
      register: policy_info_module

    - name: Get all alert policy info details (CheckMode).
      dellemc.openmanage.ome_alert_policies_info: {}
      check_mode: true
      register: policy_info_module_cm

    - name: Settings default value for alert policy info details from URI
      ansible.builtin.set_fact:
        policy_info_uri: []

    - name: Check whether hostname IP is IPv4 or IPv6.
      ansible.builtin.set_fact:
        is_ipv4: "{{ hostname is ansible.utils.ipv4 }}"
        is_ipv6: "{{ hostname is ansible.utils.ipv6 }}"

    - name: Set API URL to fetch policy information.
      ansible.builtin.set_fact:
        url: https://{{hostname}}/api/AlertService/AlertPolicies
      when: is_ipv4

    - name: Set API URL to fetch policy information.
      ansible.builtin.set_fact:
        url: https://[{{hostname}}]/api/AlertService/AlertPolicies
      when: is_ipv6

    - name: Retrieve alert policies information via URI.
      ansible.builtin.uri:
        url: "{{url}}"
        user: "{{username}}"
        password: "{{password}}"
        validate_certs: false
        status_code: 200
        force_basic_auth: true
      register: result_uri

    - name: Remove odata from result_uri.
      ansible.builtin.set_fact:
        policy_info_uri: "{{ result_uri.json |
          ansible.utils.remove_keys(target=['@odata.context',
          '@odata.id', '@odata.type', '@odata.count']) }}"
      when: result_uri.status == 200

    - name: Compare the output of policy_info from URI and module
      ansible.utils.fact_diff:
        before: "{{ policy_info_uri['value'] }}"
        after: "{{ policy_info_module['policies'] }}"
      register: diff_result

    - name: Compare the output of policy_info from URI and module(CheckMode)
      ansible.utils.fact_diff:
        before: "{{ policy_info_uri['value'] }}"
        after: "{{ policy_info_module_cm['policies'] }}"
      register: diff_result_cm

    - name: Verify status of tasks.
      ansible.builtin.assert:
        that:
          - policy_info_module.msg == policy_info_module_cm.msg ==
            "Successfully retrieved all the OME alert policies information."
          - not policy_info_module.changed
          - not policy_info_module_cm.changed
          - policy_info_module['policies'] |
            length == policy_info_module_cm['policies'] |
            length == policy_info_uri['value'] | length
          - not diff_result.changed
          - not diff_result.diff_lines
          - not diff_result_cm.changed
          - not diff_result_cm.diff_lines

  module_defaults:
    dellemc.openmanage.ome_alert_policies_info:
      validate_certs: "{{validate_certs}}"
      hostname: "{{hostname}}"
      username: "{{username}}"
      password: "{{password}}"
      port: "{{port}}"
