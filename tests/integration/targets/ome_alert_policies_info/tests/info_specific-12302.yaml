---
- name: Test that we have an OME host, OME username and OME password
  fail:
    msg: 'Please define the following variables:
      hostname, username and password.'
  when: hostname is not defined or username is
    not defined or password is not defined

- block:

    - name: Get all alert policy info details.
      dellemc.openmanage.ome_alert_policies_info:
      register: result_all

    - name: Get alert policy info details by policy_name.
      dellemc.openmanage.ome_alert_policies_info:
        policy_name: "{{ result_all.policies[0].Name }}"
      register: result_one

    - name: Get alert policy info details by policy_name(CheckMode).
      dellemc.openmanage.ome_alert_policies_info:
        policy_name: "{{ result_all.policies[0].Name }}"
      check_mode: true
      register: result_one_cm

    - name: Set fact for alert policy name details from module.
      set_fact:
        policy_info_module: "{{ result_one.policies[0] }}"
        policy_info_module_cm: "{{ result_one_cm.policies[0] }}"

    - name: Settings default value for alert policy details from URI
      set_fact:
        policy_info_uri: []

    - name: Check whether hostname IP is IPv4 or IPv6.
      set_fact:
        is_ipv4: "{{ hostname is ansible.utils.ipv4 }}"
        is_ipv6: "{{ hostname is ansible.utils.ipv6 }}"

    - name: Set API URL to fetch policy information.
      set_fact:
        url: https://{{hostname}}/api/AlertService/AlertPolicies
      when: is_ipv4

    - name: Set API URL to fetch policy information.
      set_fact:
        url: https://[{{hostname}}]/api/AlertService/AlertPolicies
      when: is_ipv6

    - name: Retrieve alert policies information via URI.
      uri:
        url: "{{url}}"
        user: "{{username}}"
        password: "{{password}}"
        validate_certs: false
        status_code: 200
        force_basic_auth: true
      register: result_uri

    - name: Remove odata from result_uri.
      set_fact:
        policy_info_uri: "{{ result_uri.json.value[0] |
          ansible.utils.remove_keys(target=['@odata.context',
          '@odata.id', '@odata.type', '@odata.count']) }}"
      when: result_uri.status == 200

    - name: Compare the output of policy_info from URI and module
      ansible.utils.fact_diff:
        before: "{{ policy_info_uri }}"
        after: "{{ policy_info_module }}"
      register: diff_result

    - name: Compare the output of policy_info from URI and module(CheckMode)
      ansible.utils.fact_diff:
        before: "{{ policy_info_uri }}"
        after: "{{ policy_info_module_cm }}"
      register: diff_result_cm

    - name: Verify status of tasks.
      assert:
        that:
          - result_one.msg == result_one_cm.msg
          - result_one.msg == ("Successfully retrieved %s OME
            alert policy information." % result_all.policies[0].Name)
          - not result_one.changed
          - not result_one_cm.changed
          - policy_info_module | length == policy_info_module_cm |
            length == policy_info_uri | length
          - not diff_result.changed
          - not diff_result.diff_lines
          - not diff_result_cm.changed
          - not diff_result_cm.diff_lines

  module_defaults:
    dellemc.openmanage.ome_alert_policies_info:
      validate_certs: "{{validate_certs}}"
      hostname: "{{hostname}}"
      username: "{{username}}"
      password: "{{password}}"
      port: "{{port}}"
