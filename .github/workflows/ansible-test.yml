  ansible-test:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        ansible-version: [stable-2.19]
        python-version: [3.13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install ansible (${{ matrix.ansible-version }})
        run: |
          pip install --upgrade pip
          pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz --disable-pip-version-check

      - name: Install test dependencies
        run: pip install -r test-requirements.txt
      - name: Run ansible-test units in Docker
        run: |
          ansible-test units --python "${{ matrix.python-version }}" --docker default --color yes

  ansible-lint:
    needs: [build]
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main

  sanity:
    needs: [build]
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@main

  unit-galaxy:
    needs: [build]
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@main

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/dellemc/openmanage
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        ansible-version: [stable-2.19]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/dellemc/openmanage

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install ansible (${{ matrix.ansible-version }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz --disable-pip-version-check

      - name: Install test dependencies
        run: pip install -r test-requirements.txt

      - name: Run Pytest with coverage
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}:$PYTHONPATH"
          pytest -vvvv --cov --cov-branch --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # run-python:
